options:
  licenseFileNames:
    - LICENSE
  packagePaths:
    - Packages/NimbleKit/Package.swift
    - Packages/AltSourceKit/Package.swift
    - Packages/Vendor/Zsign/Package.swift
    - Packages/Vendor/IDeviceKitten/Package.swift
    - Packages/NativeSigning/Package.swift
  prefix: com.vexsign.app
  xcworkspacePath: "*.xcworkspace"
  addVersionNumbers: false
  singlePage: false
  sandboxMode: true
  force: true

manual:
  - source: https://github.com/jkcoxson/idevice
    name: idevice
    body: |-
      MIT
  - name: "Zsign"
    file: "Packages/Vendor/Zsign/LICENSE"

  - name: "LiveContainer"
    file: "Packages/Vendor/Zsign/LICENSE_LC"

exclude:
  - swift-html-entities
  - LicensePlist
  - XcodeEdit
  - Yams
  - /.*-kit/
