name: Server tests

# Runs the Python backend's test suite: the premium key flow, the self-hosted
# source store, and the browser tools (repository creator, certificate status
# checker, UDID grabber). Fast enough to run on every change under server/.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest · server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        # cryptography enables the full X.509 certificate-checker tests.
        run: python -m pip install -r requirements.txt pytest cryptography

      - name: Run tests
        run: python -m pytest tests/ -q
