name: Repository autopilot

# Trusted default-branch code only; never a pull_request_target executor.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: repository-autopilot
  cancel-in-progress: false

jobs:
  maintain:
    if: vars.AUTOPILOT_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate eligible bot PRs and merge green candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/repository-autopilot.py
