name: Repository maintenance

# Trusted default-branch code only. Jobs have separate least-privilege tokens.
on:
  # Never watch this workflow itself: even a skipped run emits completion.
  workflow_run:
    workflows: ["CI", "Platform check", "Service checks", "Documentation", "Release", "Update Repository", "Combined native host · build only"]
    types: [completed]
  schedule:
    - cron: '17 */4 * * *'   # bot PRs: every 4 hours
    - cron: '40 4 * * 1'   # hygiene + Xcode package audit: weekly
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance operation'
        type: choice
        options: [all, bot-prs, hygiene, audit]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'ci-triage' || 'repo-maintenance' }}
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      (vars.AUTOPILOT_ENABLED != 'false') &&
      (github.event.schedule == '17 */4 * * *' || github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'all' || inputs.task == 'bot-prs'))
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate eligible bot PRs and merge green candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/repository-autopilot.py

  hygiene:
    if: >-
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      (github.event.schedule == '40 4 * * 1' || github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'all' || inputs.task == 'hygiene'))
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync deterministic repository metadata
        run: python3 tools/sync-strings.py --write

      - name: Validate the result
        run: make verify

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No deterministic maintenance changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and open/update the review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: automation/repo-maintenance
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore: automated repository maintenance" \
                     -m "Generated by the Repository maintenance workflow: localisation keys synchronised and the dependency-free gates re-run."
          # The branch is disposable and owned by this workflow.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "Repository maintenance refreshed this branch. Re-run \`make verify\` before merging."
            echo "Updated PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "chore: automated repository maintenance" \
              --body $'Deterministic maintenance only:\n\n- synchronised missing English localisation keys;\n- ran `make verify` successfully.\n\nNo application behaviour was changed. Review the diff and run the CI/quick gate for the branch before merging.'
            echo "Opened a review PR for ${BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          fi

  audit:
    if: >-
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      (github.event.schedule == '40 4 * * 1' || github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'all' || inputs.task == 'audit'))
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check root Xcode packages
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 tools/check-xcode-packages.py --format markdown --fail-on-outdated > "$RUNNER_TEMP/report.md"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 1 ]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -ne 0 ]; then
            echo "::error::The package audit could not parse the project."
            cat "$RUNNER_TEMP/report.md"
            exit "$STATUS"
          else
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the audit issue
        if: steps.audit.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE='Xcode package audit: updates available'
          BODY="$(printf 'A compatible update is available for one or more root Xcode SwiftPM packages.\n\n%s\n\nThis is a review prompt, not an automatic bump: root packages are pinned because they must build against the current Xcode and iOS SDK. Use the refresh procedure in `docs/MAINTENANCE.md`, then build and test on macOS.\n\nAudit run: %s/%s/actions/runs/%s\n' "$(cat "$RUNNER_TEMP/report.md")" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"

          EXISTING="$(gh issue list --state open --search 'Xcode package audit in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated issue #${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened: ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
          fi

  open-or-update-issue:
    permissions:
      actions: read
      issues: write
    if: >-
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'workflow_run' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          TITLE="Automation failed on main: ${SHORT_SHA}"
          FAILED="$(gh run view "$RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | "- `\(.name)`"] | join("\n")')"
          if [ -z "$FAILED" ]; then
            FAILED="_No failed job list was available; inspect the run log._"
          fi

          BODY="$(printf 'The `%s` workflow failed on `%s`.\n\n- Run: %s\n- Commit: `%s`\n- Failed jobs:\n%s\n\nNext steps:\n1. Open the failing job and reproduce locally with `make verify` or `make test`.\n2. Add a regression test before changing behaviour.\n3. Close this issue when main is green again.\n' "$WORKFLOW_NAME" "$SHA" "$RUN_URL" "$SHA" "$FAILED")"

          EXISTING="$(gh issue list --state open --search "Automation failed on main ${SHORT_SHA} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated issue #${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened CI failure issue: ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
          fi
