name: Repository maintenance

# Deterministic clean-up that is safe to automate: add missing localisation
# keys, run every dependency-free gate, and open a review PR only when files
# actually changed. It never pushes to main and never edits application code.
#
# This is intentionally not a "fix all bugs" bot. Behavioural fixes still need
# a failing test, a reviewed diff and a build. CI failures are triaged into
# issues by ci-triage.yml.

on:
  schedule:
    - cron: '40 4 * * 1'   # Mondays 04:40 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repo-maintenance
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync deterministic repository metadata
        run: python3 tools/sync-strings.py --write

      - name: Validate the result
        run: make verify

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No deterministic maintenance changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and open/update the review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: automation/repo-maintenance
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore: automated repository maintenance" \
                     -m "Generated by the Repository maintenance workflow: localisation keys synchronised and the dependency-free gates re-run."
          # The branch is disposable and owned by this workflow.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "Repository maintenance refreshed this branch. Re-run \`make verify\` before merging."
            echo "Updated PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "chore: automated repository maintenance" \
              --body $'Deterministic maintenance only:\n\n- synchronised missing English localisation keys;\n- ran `make verify` successfully.\n\nNo application behaviour was changed. Review the diff and run the CI/quick gate for the branch before merging.'
            echo "Opened a review PR for ${BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          fi
