name: Pin release TLS identity

# Manual bootstrap/rotation only. Never upload the downloaded identity or keys.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-release-tls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pin:
    name: Generate and verify a release TLS pin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Generate the public pin and verify a fresh download
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          make deps-pin
          make deps-release
          echo 'Pin generated and a fresh download matched it.'

      - name: Upload public pin only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-tls-pin-${{ github.run_id }}
          path: Scripts/local-tls/pinned-pack.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Next steps
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Release TLS pin ready for review

          1. Download the **release-tls-pin** artifact from this run and unzip it.
          2. Review the source, common name, expiry (in the generation log), and digest.
             Confirm this is the install-server identity you intend to distribute.
             A matching download proves consistency, not independent trust in the source.
          3. After review, set the digest (64 hexadecimal characters) as the
             `RELEASE_TLS_SHA256` variable under Settings → Environments → release.
             Alternatively, commit the public pin through a reviewed PR.
          4. Configure environment protection as documented in docs/RELEASING.md,
             then run Release. Do not publish from this bootstrap run.

          No private key is included in the artifact. No release or tag was created.
          A future identity rotation requires a new reviewed pin.
          EOF
          { printf '\nPublic digest to approve: `'; sed -n 's/^sha256://p' Scripts/local-tls/pinned-pack.sha256 | tr -d '\n'; printf '`\n'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove downloaded private-key material
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/VexSign/tls-pin" "${RUNNER_TEMP}/VexSign/tls-release" deps
