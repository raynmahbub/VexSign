name: CI repair assistant

# The workflow_run boundary keeps write credentials out of the failing CI job.
# The model job only reads logs/source and emits a constrained patch artifact;
# a separate write-enabled job validates and publishes that patch as a draft PR.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-repair-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'automation/bugfix-agent/')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      patch_ready: ${{ steps.agent.outputs.patch_ready }}
    steps:
      - name: Checkout trusted default-branch tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Propose a constrained fix
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUGFIX_AGENT_MODEL: ${{ vars.BUGFIX_AGENT_MODEL || 'gpt-4.1-mini' }}
        run: python3 Tools/CI/ci_repair_agent.py propose

      - name: Upload candidate patch
        if: steps.agent.outputs.patch_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-repair-${{ github.run_id }}
          path: bugfix-candidate/
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: propose
    if: >-
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      needs.propose.outputs.patch_ready == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Checkout the exact failing commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          persist-credentials: false
      - name: Download candidate patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-repair-${{ github.run_id }}
          path: bugfix-candidate
      - name: Verify patch scope and applicability
        env:
          TARGET_REPO: target
          BUGFIX_ARTIFACT_DIR: bugfix-candidate
        run: |
          if [ -f trusted/Tools/CI/ci_repair_agent.py ]; then AGENT=trusted/Tools/CI/ci_repair_agent.py; else AGENT=trusted/tools/ci_repair_agent.py; fi
          python3 "$AGENT" validate

  publish:
    needs: [propose, validate]
    if: >-
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      needs.propose.outputs.patch_ready == 'true' &&
      needs.validate.result == 'success'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Checkout the exact failing commit for patch publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          persist-credentials: true
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Download verified candidate patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-repair-${{ github.run_id }}
          path: bugfix-candidate
      - name: Publish as a draft replacement PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REPO: target
          BUGFIX_ARTIFACT_DIR: bugfix-candidate
        run: |
          if [ -f trusted/Tools/CI/ci_repair_agent.py ]; then AGENT=trusted/Tools/CI/ci_repair_agent.py; else AGENT=trusted/tools/ci_repair_agent.py; fi
          python3 "$AGENT" publish
