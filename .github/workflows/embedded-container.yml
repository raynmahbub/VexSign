name: Guest-host prototype · build only

# Deliberately opt-in. No auto-publishing, signing secrets, PR triggers or changes
# to the normal VexSign release pipeline. Install/re-sign the IPA as a host app.
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Installed Xcode version prefix (26.2 or newer)'
        required: true
        default: '26.2'

permissions:
  contents: read

concurrency:
  group: embedded-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Repository and packaging regressions
        run: |
          make verify

  build:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Select installed Xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode }}
        run: bash .github/scripts/select_xcode.sh
      - name: Install packaging tool
        run: brew install ldid
      - name: Build normal VexSign guest input
        run: |
          set -euo pipefail
          make VexSign 2>&1 | tee "$RUNNER_TEMP/vexsign-build.log"
      - name: Build native host and combined IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 EmbeddedContainer/build.py --vexsign-ipa packages/VexSign.ipa 2>&1 | tee "$RUNNER_TEMP/combined-build.log"
      - name: Upload combined build and integration sources
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VexSign-LiveContainer-SideStore-unvalidated
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/VexSign+LiveContainer+SideStore.ipa
            packages/VexSign+LiveContainer+SideStore.integration-sources.tar.gz
            packages/VexSign+LiveContainer+SideStore.build.json
            packages/VexSign+LiveContainer+SideStore.checksums.txt
      - name: Combined build summary
        run: |
          {
            echo '## Experimental combined host'
            echo 'One host IPA includes the LiveContainer runtime, embedded SideStore and bundled VexSign guest.'
            echo 'This is not the VexSign-primary production architecture. No device acceptance is claimed.'
            echo 'Download VexSign-LiveContainer-SideStore-unvalidated within 14 days; verify its checksums before re-signing.'
            echo 'The artifact includes integration sources and build metadata. Normal releases are unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: embedded-container-build-logs
          retention-days: 3
          path: |
            ${{ runner.temp }}/vexsign-build.log
            ${{ runner.temp }}/combined-build.log
