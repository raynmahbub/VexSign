name: Combined native host · build only

# Read-only validation for combined-host changes: no publishing, Apple-account
# operations or signing secrets. Install/re-sign the unvalidated IPA yourself.
on:
  push:
    branches: [main]
    paths:
      - 'EmbeddedContainer/**'
      - 'VexSign/Backend/Companion/PrimaryHostEntry.swift'
      - 'VexSign/Resources/Info.plist'
      - 'VexSign.xcodeproj/**'
      - 'NativeSigning/**'
      - 'SideSign/Sources/**'
      - 'VexSign/Security/AppleAccount*.swift'
      - 'Makefile'
      - '.github/scripts/select_xcode.sh'
      - '.github/scripts/quick_check.py'
      - '.github/scripts/xcodebuild_report.py'
      - 'SideSign/Package.swift'
      - '.github/workflows/embedded-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'EmbeddedContainer/**'
      - 'VexSign/Backend/Companion/PrimaryHostEntry.swift'
      - 'VexSign/Resources/Info.plist'
      - 'VexSign.xcodeproj/**'
      - 'NativeSigning/**'
      - 'SideSign/Sources/**'
      - 'VexSign/Security/AppleAccount*.swift'
      - 'Makefile'
      - '.github/scripts/select_xcode.sh'
      - '.github/scripts/quick_check.py'
      - '.github/scripts/xcodebuild_report.py'
      - 'SideSign/Package.swift'
      - '.github/workflows/embedded-container.yml'
  workflow_dispatch:
    inputs:
      host_mode:
        description: 'Primary UI architecture (both require native/device acceptance)'
        type: choice
        options: [native-primary, guest-prototype]
        default: native-primary
      xcode:
        description: 'Installed Xcode version prefix (26.2 or newer)'
        required: true
        default: '26.2'
      # Manual native link smoke (replaces the standalone native-signing-smoke
      # workflow). Selecting link_smoke skips the combined-host build above.
      link_smoke:
        description: 'Run the native link smoke instead of the combined-host build'
        type: boolean
        default: false
      unit_tests:
        description: 'Link smoke: synthetic native unit regressions (no Apple login)'
        type: boolean
        default: true
      server_compatibility:
        description: 'Link smoke: also resolve/build/test the Vapor/Crypto candidate'
        type: boolean
        default: false
      combined_dependencies:
        description: 'Link smoke: also resolve/verify the combined app-package candidate'
        type: boolean
        default: false
      simulator:
        description: 'Link smoke: also compile/link for the arm64 iOS Simulator'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: embedded-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Repository and packaging regressions
        run: |
          make verify

  build:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' && (github.event_name != 'workflow_dispatch' || inputs.link_smoke != true)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Select installed Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE }}
        run: bash .github/scripts/select_xcode.sh
      # Cache dependency downloads only, never packaged output or signed products.
      - name: Restore Swift package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/VexSign/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-combined-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved', 'EmbeddedContainer/inputs.lock.json', 'NativeSigning/inputs.lock.json') }}
      - name: Install packaging tool
        run: command -v ldid >/dev/null 2>&1 || brew install ldid
      - name: Native unit regressions (synthetic accounts only)
        id: native_tests
        run: |
          set -uo pipefail
          python3 NativeSigning/prepare_smoke.py 2>&1 | tee "$RUNNER_TEMP/native-signing-prepare.log"
          status=$?
          if [ "$status" -eq 0 ]; then
            swift test --package-path .build/native-signing-smoke 2>&1 | tee "$RUNNER_TEMP/native-signing-unit-tests.log"
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Report native unit diagnostics
        if: always() && steps.native_tests.outcome != 'skipped'
        env:
          NATIVE_EXIT: ${{ steps.native_tests.outputs.exit_code }}
        run: |
          cat "$RUNNER_TEMP"/native-signing-*.log > "$RUNNER_TEMP/native-signing-diagnostics.log"
          python3 .github/scripts/xcodebuild_report.py \
            --log "$RUNNER_TEMP/native-signing-diagnostics.log" \
            --build-exit "${NATIVE_EXIT:-1}" --warnings-as-errors false \
            --title 'Native synthetic unit tests' --workspace "$GITHUB_WORKSPACE"
      - name: Build standalone VexSign native input
        id: native_input
        env:
          TMPDIR: ${{ runner.temp }}/
          # Do not reuse the restored global SwiftPM artifact cache. Its stale
          # binary archives caused "already exists in file system" resolution
          # failures in this build; xcodebuild gets a job-owned cache instead.
          SPM_CACHE_PATH: ${{ runner.temp }}/SwiftPMCache-NativeInput
        run: |
          set -uo pipefail
          APP_VERSION="$(grep -oE 'MARKETING_VERSION = [^;]+;' VexSign.xcodeproj/project.pbxproj \
            | head -n 1 | sed -E 's/.*= "?([^";]+)"?;.*/\1/')"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          make VexSign 2>&1 | tee "$RUNNER_TEMP/vexsign-build.log"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Report standalone build diagnostics
        if: always() && steps.native_input.outcome != 'skipped'
        env:
          BUILD_EXIT: ${{ steps.native_input.outputs.exit_code }}
        run: |
          python3 .github/scripts/xcodebuild_report.py \
            --log "$RUNNER_TEMP/vexsign-build.log" --build-exit "${BUILD_EXIT:-1}" \
            --warnings-as-errors false --title 'Native input build' --workspace "$GITHUB_WORKSPACE"
      - name: Preserve unsigned native input
        if: always() && steps.native_input.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VexSign-native-input-unsigned
          path: packages/VexSign-${{ steps.native_input.outputs.app_version }}.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Build native host and combined IPA
        id: combined
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_MODE: ${{ inputs.host_mode || 'native-primary' }}
        run: |
          set -uo pipefail
          python3 EmbeddedContainer/build.py --mode "$HOST_MODE" \
            --vexsign-ipa "packages/VexSign-${{ steps.native_input.outputs.app_version }}.ipa" \
            2>&1 | tee "$RUNNER_TEMP/combined-build.log"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Report combined packaging diagnostics
        if: always() && steps.combined.outcome != 'skipped'
        env:
          BUILD_EXIT: ${{ steps.combined.outputs.exit_code }}
        run: |
          python3 .github/scripts/xcodebuild_report.py \
            --log "$RUNNER_TEMP/combined-build.log" --build-exit "${BUILD_EXIT:-1}" \
            --warnings-as-errors false --title 'Combined native packaging' --workspace "$GITHUB_WORKSPACE"
      - name: Upload combined build and integration sources
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VexSign-LiveContainer-SideStore-${{ inputs.host_mode || 'native-primary' }}-unvalidated
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/VexSign+LiveContainer+SideStore.ipa
            packages/VexSign+LiveContainer+SideStore.integration-sources.tar.gz
            packages/VexSign+LiveContainer+SideStore.build.json
            packages/VexSign+LiveContainer+SideStore.checksums.txt
      - name: Combined build summary
        env:
          HOST_MODE: ${{ inputs.host_mode || 'native-primary' }}
        run: |
          {
            echo '## Experimental combined host'
            echo "Architecture: $HOST_MODE. One host IPA includes LiveContainer runtime and embedded SideStore."
            echo 'Native-primary boots VexSign directly without guest isolation hooks. Guest-prototype retains the older architecture. No device acceptance is claimed.'
            echo 'Download the mode-labelled unvalidated artifact within 14 days; verify its checksums before re-signing.'
            echo 'The artifact includes integration sources and build metadata. Normal releases are unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: embedded-container-build-logs
          retention-days: 3
          path: |
            ${{ runner.temp }}/native-signing-prepare.log
            ${{ runner.temp }}/native-signing-unit-tests.log
            .build/native-signing-smoke/provenance.json
            ${{ runner.temp }}/vexsign-build.log
            ${{ runner.temp }}/combined-build.log

  # Manual-only diagnostics (dispatch with link_smoke). Stages isolated pinned
  # graphs, runs synthetic unit regressions and links NativeSigning for device
  # (and optionally simulator) — no Apple login, provisioning, certificates or
  # publication. Replaces the standalone native-signing-smoke workflow.
  link-smoke:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' && github.event_name == 'workflow_dispatch' && inputs.link_smoke == true
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select installed Xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh
      - name: Optionally validate the separate Vapor and Crypto candidate
        if: inputs.server_compatibility
        run: |
          set -euo pipefail
          python3 NativeSigning/prepare_server_compatibility.py
          swift package --package-path .build/server-dependency-compatibility resolve
          python3 NativeSigning/prepare_server_compatibility.py --verify-resolved
          swift test --package-path .build/server-dependency-compatibility --force-resolved-versions \
            2>&1 | tee "$RUNNER_TEMP/server-dependency-compatibility.log"
      - name: Optionally resolve the combined app-package and SDK candidate
        if: inputs.combined_dependencies
        run: |
          set -euo pipefail
          python3 NativeSigning/prepare_combined_smoke.py
          swift package --package-path .build/combined-signing-smoke resolve \
            2>&1 | tee "$RUNNER_TEMP/combined-signing-resolution.log"
          python3 NativeSigning/prepare_combined_smoke.py \
            --verify-resolved .build/combined-signing-smoke/Package.resolved
      - name: Verify the CMS fixture still matches its recorded digest
        run: |
          set -euo pipefail
          python3 NativeSigning/Fixtures/make_cms_fixture.py --check
      - name: Prepare pinned isolated package graph
        run: |
          set -euo pipefail
          python3 NativeSigning/prepare_smoke.py 2>&1 | tee "$RUNNER_TEMP/native-signing-prepare.log"
      - name: Run native unit regressions without account operations
        if: inputs.unit_tests
        run: |
          set -euo pipefail
          swift test --package-path .build/native-signing-smoke \
            2>&1 | tee "$RUNNER_TEMP/native-signing-unit-tests.log"
      - name: Compile and dynamically link device dependencies
        working-directory: .build/native-signing-smoke
        run: |
          set -euo pipefail
          xcodebuild -scheme NativeSigningLinkSmoke -destination 'generic/platform=iOS' \
            -sdk iphoneos -derivedDataPath ../native-signing-device \
            -configuration Release ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/native-signing-device.log"
      - name: Optionally compile and link simulator dependencies
        if: inputs.simulator
        working-directory: .build/native-signing-smoke
        run: |
          set -euo pipefail
          xcodebuild -scheme NativeSigningLinkSmoke -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator -derivedDataPath ../native-signing-simulator \
            -configuration Release ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/native-signing-simulator.log"
      - name: Upload diagnostic logs and provenance only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-signing-link-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/native-signing-unit-tests.log
            ${{ runner.temp }}/native-signing-prepare.log
            ${{ runner.temp }}/native-signing-device.log
            ${{ runner.temp }}/native-signing-simulator.log
            .build/native-signing-smoke/provenance.json
            ${{ runner.temp }}/server-dependency-compatibility.log
            .build/server-dependency-compatibility/provenance.json
            .build/server-dependency-compatibility/resolution-attestation.json
            ${{ runner.temp }}/combined-signing-resolution.log
            .build/combined-signing-smoke/combined-provenance.json
            .build/combined-signing-smoke/combined-resolution-attestation.json
