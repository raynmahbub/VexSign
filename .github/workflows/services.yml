name: Service checks

# Cheap service suites share an entry point, preserving the check names.
on:
  push:
    branches: [main]
    paths:
      - 'Services/WebManager/**'
      - 'Services/Cloud/**'
      - 'Services/Cloud/Anisette/**'
      - 'Services/WebManager/Configuration/render.yaml'
      - 'render.yaml'
      - '.github/workflows/services.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Services/WebManager/**'
      - 'Services/Cloud/**'
      - 'Services/Cloud/Anisette/**'
      - 'Services/WebManager/Configuration/render.yaml'
      - 'render.yaml'
      - '.github/workflows/services.yml'
  schedule:
    - cron: '0 6 * * 2'   # weekly dependency advisories, even without source edits
  workflow_dispatch:

permissions:
  contents: read

# A superseded push to a pull request should stop: the newest commit is the one under
# review. A push to main is the opposite — those commits are already merged, and cancelling the
# run destroys the only validation that commit will ever get. On main the group is therefore
# keyed by SHA, so consecutive merges queue independently instead of replacing each other.
# (Before this, runs 370-386 on main were all cancelled and main had no completed CI.)
concurrency:
  group: services-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # Not gated on public visibility, unlike the macOS jobs: it consumes no paid
    # runner minutes, and gating it meant a private repository (or a private fork)
    # silently skipped every validation while the check went green.
    name: pytest · server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Services/WebManager/API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same rule as the cloud job's audit: a fresh upstream advisory must not
      # fail a PR that never touched the manifest. The weekly schedule still
      # scans even with no edits.
      - name: Dependency changes
        id: deps
        if: github.event_name != 'schedule'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --quiet --depth=1 origin "$BASE" 2>/dev/null; then
            if git diff --quiet "$BASE" HEAD -- :/Services/WebManager/Configuration/requirements.txt; then
              changed=false
            fi
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Services/WebManager/Configuration/requirements.txt

      - name: Install dependencies
        # Everything the service needs at runtime is in requirements.txt, so CI
        # installs exactly what the Dockerfile and the Render build install.
        # `cryptography` used to be added here ad hoc, which let the suite pass
        # against a configuration no deployment ever ran.
        run: python -m pip install -r ../Configuration/requirements.txt pytest

      - name: Run tests
        run: python -m pytest ../Tests/ -q

      - name: WebManager relay matches iOS WebManagerServer contract
        working-directory: .
        run: python3 Tools/Audit/test_webmanager_relay_contract.py

      # The Python counterpart of `npm audit` below. This service parses
      # untrusted uploads and fetches user-supplied URLs, and its SSRF guard is
      # pinned to exact httpx/httpcore internals, so its dependency surface is
      # worth scanning on the same cadence as the cloud service's.
      - name: Python dependency audit
        if: github.event_name == 'schedule' || steps.deps.outputs.changed == 'true'
        run: |
          set +e
          # The console script is `pip-audit`; `python -m pip-audit` resolves to a
          # module named "pip-audit" and fails with "No module named pip-audit",
          # which reads like a missing dependency rather than a wrong entry point.
          python -m pip install pip-audit
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            echo "::error title=pip-audit::installing pip-audit failed (exit ${install_status})"
            exit "$install_status"
          fi
          python -m pip_audit --progress-spinner off --strict \
            -r ../Configuration/requirements.txt 2>&1 | tee "$RUNNER_TEMP/pip-audit.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The raw job log is not always reachable, so mirror the reason onto
            # the check itself: a fresh advisory has to say which package it is.
            while IFS= read -r line; do
              echo "::error title=pip-audit::$line"
            done < <(tail -n 15 "$RUNNER_TEMP/pip-audit.log")
          fi
          exit "$status"

  cloud:
    # Not gated on public visibility, unlike the macOS jobs: it consumes no paid
    # runner minutes, and gating it meant a private repository (or a private fork)
    # silently skipped every validation while the check went green.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Services/Cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Audit the resolved dependency tree, not every source-only change: a
      # fresh upstream advisory must not fail a PR that never touched the
      # manifest. The weekly schedule still scans even with no edits.
      - name: Dependency changes
        id: deps
        if: github.event_name != 'schedule'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --quiet --depth=1 origin "$BASE" 2>/dev/null; then
            if git diff --quiet "$BASE" HEAD -- :/Services/Cloud/package.json :/Services/Cloud/package-lock.json; then
              changed=false
            fi
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Services/Cloud/package-lock.json
      - run: npm ci
      # `build` is `tsc -p ...`; it type-checks and emits, so the old
      # `check` (`tsc --noEmit`) step was the same work twice.
      - run: npm run build
      - run: npm test
      - run: npm run contracts && git diff --exit-code -- openapi.json
      # The iOS client decodes the contract above by hand. This compares the two texts, so a
      # renamed field fails here instead of in an accepted submission that cannot be decoded.
      - name: iOS client matches the documented contract
        working-directory: .
        run: python3 Tools/Audit/test_cloud_signing_contract.py
      - run: npm audit --omit=dev --audit-level=high
        if: github.event_name == 'schedule' || steps.deps.outputs.changed == 'true'

  anisette:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
      && github.event_name != 'schedule'
    name: swift build · anisette mock
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Services/Cloud/Anisette
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Anisette protocol mock
        run: swift build

