name: Ecosystem contracts

# The TypeScript cloud signer and the app-side modules that talk to it.
# Path-filtered: a PR that touches none of these never starts it.
#
# The weekly run exists for `npm audit`: a new advisory is published against a
# dependency that nobody touched, and that should surface on a Tuesday morning
# rather than as a red check on an unrelated pull request.
on:
  pull_request:
    paths:
      - 'cloud-signing/**'
      - 'VexSign/RepositoryBuilder/**'
      - 'VexSign/RepositorySync/**'
      - 'VexSign/Discovery/**'
      - 'VexSign/CertificateDashboard/**'
      - 'VexSign/Security/**'
      - 'VexSign/OTA/**'
      - 'VexSign/Analytics/**'
      - 'VexSign/CloneWizard/**'
      - 'VexSign/Ecosystem/**'
      - '.github/workflows/ecosystem.yml'
  schedule:
    - cron: '0 6 * * 2'   # Tuesdays 06:00 UTC: dependency advisories
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-signing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud-signing/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run contracts && git diff --exit-code -- openapi.json
      - run: npm audit --omit=dev --audit-level=high
# The existing Release workflow builds the full iOS app on macOS for PRs.
