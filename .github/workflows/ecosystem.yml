name: Ecosystem contracts

# Validate cloud changes on relevant PRs, main pushes or on demand. Native app changes are
# covered by ci.yml; do not spend a cloud run on unrelated Swift-only edits.
# Keep the weekly audit to detect new advisories without a source change.
on:
  push:
    branches: [main]
    paths:
      - 'cloud-signing/**'
      - '.github/workflows/ecosystem.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloud-signing/**'
      - '.github/workflows/ecosystem.yml'
  schedule:
    - cron: '0 6 * * 2'   # Tuesdays 06:00 UTC: dependency advisories
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud-signing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud-signing/package-lock.json
      - run: npm ci
      # `build` is `tsc -p ...`; it type-checks and emits, so the old
      # `check` (`tsc --noEmit`) step was the same work twice.
      - run: npm run build
      - run: npm test
      - run: npm run contracts && git diff --exit-code -- openapi.json
      - run: npm audit --omit=dev --audit-level=high
# Native app validation is handled by ci.yml on relevant PRs/main or manual dispatch.
