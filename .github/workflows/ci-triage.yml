name: CI triage

# Turn a failed CI run on main into an actionable issue instead of a red X that
# nobody notices. This is detection, not an automatic code fix: a bot cannot
# safely guess at SwiftUI or signing behaviour without a reproducer.

on:
  workflow_run:
    workflows: ["CI", "Platform check", "Server tests", "Ecosystem contracts", "Release", "Repository autopilot", "Automatic stable release", "Update Repository", "Repository maintenance"]
    types: [completed]

permissions:
  actions: read
  issues: write

concurrency:
  group: ci-triage-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  open-or-update-issue:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          TITLE="CI failed on main: ${SHORT_SHA}"
          FAILED="$(gh run view "$RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | "- `\(.name)`"] | join("\n")')"
          if [ -z "$FAILED" ]; then
            FAILED="_No failed job list was available; inspect the run log._"
          fi

          BODY="$(printf 'The `CI` workflow failed on `%s`.\n\n- Run: %s\n- Commit: `%s`\n- Failed jobs:\n%s\n\nNext steps:\n1. Open the failing job and reproduce locally with `make verify` or `make test`.\n2. Add a regression test before changing behaviour.\n3. Close this issue when main is green again.\n' "$SHA" "$RUN_URL" "$SHA" "$FAILED")"

          EXISTING="$(gh issue list --state open --search "CI failed on main ${SHORT_SHA} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated issue #${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened CI failure issue: ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
          fi
