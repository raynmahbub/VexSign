name: Update Repository

on:
  release:
    types: [published]
  # Manual backfill: re-sync app-repo.json against a given release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v1.2.0). Uses latest published release if empty."
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-repo-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false)
    # Nightly and other pre-releases must never become the installation
    # listing's latest version. Only published stable releases sync.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The `release` event fires on refs/tags/<tag>; we need the default
          # branch checked out as the base for a review PR.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update app-repo.json
        id: update
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          # Tag comes from the release event when triggered by a publish; for
          # manual dispatches we fall back to the user-provided input (empty
          # string means "use latest").
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./tools/update-repo.sh
          TAG="${RELEASE_TAG:-$(jq -r '.apps[0].version' app-repo.json)}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Open or refresh listing review PR
        env:
          VERSION: ${{ steps.update.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- app-repo.json; then
            echo "app-repo.json is unchanged, nothing to commit."
            exit 0
          fi

          BRANCH="automation/release-listing"
          git switch -C "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-repo.json
          git commit -m "chore(release): update app-repo.json for v${VERSION}"
          # Only this disposable automation branch is updated, never main.
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "chore(release): update stable app listing" \
              --body "Updates app-repo.json from a verified published stable release. Review version, URL, size and release notes before merging. Nightlies never update this listing."
          else
            echo "Refreshed listing PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          fi
