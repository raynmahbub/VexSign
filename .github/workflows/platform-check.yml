name: Platform check

# Compiles the companion targets — Apple TV, Apple Vision Pro and Apple Watch —
# which `ci.yml` skips because it only builds the iOS scheme. Unsigned,
# simulator-agnostic builds: they prove the sources type-check per SDK.
#
# The companions mirror the iPhone app (docs/PLATFORMS.md), so this also guards
# VexSign/Companion/* and the shared Keychain primitive, compiled into the
# iOS, tvOS and visionOS targets — a change that breaks only one shows up here, not on a device.

on:
  push:
    branches: [main]
    paths:
      - 'VexSignTV/**'
      - 'VexSignVision/**'
      - 'VexSignWatch/**'
      - 'VexSignWatchWidgets/**'
      - 'VexSign/Companion/**'
      - 'VexSign/Security/SecureSecretStore.swift'
      - 'VexSign/Utilities/Security/LocalNetworkHost.swift'
      - 'PlatformInfo/**'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - 'NimbleKit/**'
      - 'AltSourceKit/**'
      - 'Vendor/**'
      - '.github/scripts/select_xcode.sh'
      - '.github/scripts/prefetch_spm_artifacts.py'
      - '.github/scripts/xcodebuild_report.py'
      - '.github/workflows/platform-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'VexSignTV/**'
      - 'VexSignVision/**'
      - 'VexSignWatch/**'
      - 'VexSignWatchWidgets/**'
      - 'VexSign/Companion/**'
      - 'VexSign/Security/SecureSecretStore.swift'
      - 'VexSign/Utilities/Security/LocalNetworkHost.swift'
      - 'PlatformInfo/**'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - 'NimbleKit/**'
      - 'AltSourceKit/**'
      - 'Vendor/**'
      - '.github/scripts/select_xcode.sh'
      - '.github/scripts/prefetch_spm_artifacts.py'
      - '.github/scripts/xcodebuild_report.py'
      - '.github/workflows/platform-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded push to a pull request should stop: the newest commit is the one under
# review. A push to main is the opposite — those commits are already merged, and cancelling the
# run destroys the only validation that commit will ever get. On main the group is therefore
# keyed by SHA, so consecutive merges queue independently instead of replacing each other.
# (Before this, runs 370-386 on main were all cancelled and main had no completed CI.)
concurrency:
  group: platform-check-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
    name: ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: xcodebuild · VexSignTV · tvOS
            scheme: VexSignTV
            destination: 'generic/platform=tvOS Simulator'
          - label: xcodebuild · VexSignVision · visionOS
            scheme: VexSignVision
            destination: 'generic/platform=visionOS Simulator'
          - label: xcodebuild · VexSignWatch · watchOS
            scheme: VexSignWatch
            destination: 'generic/platform=watchOS Simulator'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Paths
        run: echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData-${{ matrix.scheme }}" >> "$GITHUB_ENV"

      - name: Select Xcode
        env:
          REQUESTED_XCODE: ${{ vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # All three platform legs resolve the same package graph. Share one
      # cache entry instead of three near-identical matrix-keyed entries; the
      # first leg saves it, every leg restores into its own DerivedData.
      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/DerivedData-${{ matrix.scheme }}/SourcePackages
          key: spm-platform-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-platform-${{ runner.os }}-

      - name: Prefetch verified binary archives
        run: |
          python3 .github/scripts/prefetch_spm_artifacts.py \
            --cache "${RUNNER_TEMP}/SwiftPMCache-${{ matrix.scheme }}/artifacts"

      - name: Build (Debug, unsigned)
        id: build
        env:
          # Use a job-owned artifact cache rather than the runner-global SwiftPM
          # cache: restored package artifacts must not collide with stale downloads.
          TMPDIR: ${{ runner.temp }}/
        run: |
          set -uo pipefail
          echo "BUILD_LOG=${RUNNER_TEMP}/${{ matrix.scheme }}-build.log" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace VexSign.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -packageCachePath "${RUNNER_TEMP}/SwiftPMCache-${{ matrix.scheme }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "${RUNNER_TEMP}/${{ matrix.scheme }}-build.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild (${{ matrix.scheme }}) exited with status ${status}."
          fi
          exit "${status}"

      - name: Save Swift packages
        if: success() && matrix.scheme == 'VexSignTV' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/DerivedData-${{ matrix.scheme }}/SourcePackages
          key: spm-platform-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      # Inline annotations so a compile error in a companion target can be read
      # from the PR page. Warnings are not gated here: these targets have no
      # committed baseline, and the iOS build check owns that gate.
      - name: Report diagnostics
        if: always() && steps.build.outcome != 'skipped'
        run: |
          python3 .github/scripts/xcodebuild_report.py \
            --log "$BUILD_LOG" \
            --build-exit "${{ steps.build.outputs.exit_code || 1 }}" \
            --warnings-as-errors false \
            --baseline "${RUNNER_TEMP}/${{ matrix.scheme }}-baseline.json" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-build-log-${{ matrix.scheme }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.scheme }}-build.log
          if-no-files-found: ignore
          retention-days: 3
