name: CI

# Answers "is this commit good?" for every relevant push and PR.
#
#   quick   ~1 min · Linux container: Swift syntax, resources, project
#           structure and the repo gates in tools/. `tools/ci-scope.py` then
#           decides whether the macOS jobs are needed (portable-only diffs,
#           e.g. docs or tools/*.py, skip them). Docs-only changes never
#           start this workflow at all — see docs.yml.
#   build   macOS · unsigned Debug build, warnings gate (baseline in
#           .github/build-warnings-baseline.json), 14-day test IPA.
#   tests   macOS · simulator tests, in parallel with build.
#
# Not here: release builds (release.yml), companion SDKs (platform-check.yml),
# Python/TypeScript services (services.yml), SwiftLint (`make lint` locally).
#
# Knobs (Settings → Secrets and variables → Actions → Variables):
#   BUILD_XCODE               Xcode version prefix ("26.3"). Empty = newest on
#                             the runner; the code needs the iOS 26 SDK.
#   BUILD_WARNINGS_AS_ERRORS  "true" (default, baseline tolerated) · "strict"
#                             (every warning fails) · "false" (report only).
#   QUICK_CHECK_SWIFT_IMAGE   Swift container tag for the quick job.

on:
  push:
    branches: [main]
    paths:
      - 'VexSign/**'
      - 'VexSignTests/**'
      - 'VexSignWidgetExtension/**'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - 'NimbleKit/**'
      - 'AltSourceKit/**'
      - 'Vendor/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'
      - 'Tweaks/**'
      - 'tools/**'
      - 'EmbeddedContainer/*.py'
      - 'EmbeddedContainer/tests/**'
      - 'EmbeddedContainer/HostOverlay/**'
      - 'EmbeddedContainer/patches/**'
      - 'EmbeddedContainer/inputs.lock.json'
      - 'NativeSigning/**'
      - 'SideSign/**'
      - '.github/scripts/**'
      - '.github/build-warnings-baseline.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-repair-assistant.yml'
  pull_request:
    branches: [main]
    paths:
      - 'VexSign/**'
      - 'VexSignTests/**'
      - 'VexSignWidgetExtension/**'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - 'NimbleKit/**'
      - 'AltSourceKit/**'
      - 'Vendor/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'
      - 'Tweaks/**'
      - 'tools/**'
      - 'EmbeddedContainer/*.py'
      - 'EmbeddedContainer/tests/**'
      - 'EmbeddedContainer/HostOverlay/**'
      - 'EmbeddedContainer/patches/**'
      - 'EmbeddedContainer/inputs.lock.json'
      - 'NativeSigning/**'
      - 'SideSign/**'
      - '.github/scripts/**'
      - '.github/build-warnings-baseline.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-repair-assistant.yml'
  workflow_dispatch:
    inputs:
      validation:
        description: 'quick: Linux checks only; full: checks, unsigned build and simulator tests'
        type: choice
        options: [full, quick]
        default: full
        required: true
      xcode:
        description: 'Xcode version prefix (e.g. "26.3", "16.4"). Empty = BUILD_XCODE variable or newest installed.'
        required: false
        default: ''
      warnings_as_errors:
        description: 'First-party warnings: true = fail on new ones (baseline tolerated), strict = fail on all, false = report only'
        type: choice
        options: ['true', 'strict', 'false']
        required: false
        default: 'true'

permissions:
  contents: read

# Newer runs for the same ref supersede stale work; other branches are independent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: everything that can be decided without Xcode.
  # ---------------------------------------------------------------------------
  quick:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
    name: quick · syntax, resources, gates
    outputs:
      native: ${{ steps.scope.outputs.native }}
    # Pinned, not `ubuntu-latest`: the Swift container below is built for 24.04.
    # Bump both together when the image tag changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ vars.QUICK_CHECK_SWIFT_IMAGE || 'swift:6.4-noble' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # ci-scope diffs the whole PR/push against its base

      - name: Toolchain and scope
        id: scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swiftc --version
          python3 --version || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
          python3 tools/ci-scope.py

      # swiftc -parse on every first-party file, duplicate types/file names,
      # broken plists/xcstrings, layout/script sanity — plus its own regressions.
      - name: Quick check
        run: |
          python3 .github/scripts/quick_check.py --self-test
          python3 .github/scripts/quick_check.py --root . --json "$RUNNER_TEMP/quick-check.json"

      # Deeper Xcode project structure (no Xcode needed) and the frozen
      # repository gates: localisation, error discipline, singleton freeze,
      # concurrency escapes.
      - name: Repository gates
        run: |
          python3 tools/check-pbxproj.py
          python3 tools/check-package-graph.py
          python3 tools/sync-strings.py --check
          python3 tools/test_sync_strings.py
          python3 tools/error-discipline.py
          python3 tools/singleton-freeze.py
          python3 tools/concurrency-discipline.py

      # Documentation links plus the offline regression suites.
      - name: Docs and regressions
        run: |
          python3 tools/check-docs.py
          python3 tools/test_docs.py
          python3 tools/test_ci_repair_agent.py
          python3 tools/test_device_acceptance.py
          python3 tools/test_release_assets.py
          python3 tools/test_autopilot.py
          python3 tools/test_workflow_policy.py
          python3 tools/test_workflow_trace_policy.py
          python3 tools/test_build_provenance.py
          python3 tools/test_package_graph.py
          python3 tools/test_coverage_report.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-check.json
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Does it compile?
  # ---------------------------------------------------------------------------
  build:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' && (github.event_name != 'workflow_dispatch' || inputs.validation != 'quick') && needs.quick.outputs.native == 'true'
    name: build · VexSign Debug (unsigned)
    needs: quick
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # The `runner` context is not available in job-level env, so the scratch
      # paths are exported from a step instead.
      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSign.xcresult"
            echo "BUILD_LOG=${RUNNER_TEMP}/xcodebuild.log"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Package checkouts are shared with the test job. Only this job saves the
      # cache, avoiding competing post-job uploads when both runners finish.
      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-${{ runner.os }}-

      # Unsigned generic iOS build: no certificates exist on the runner and
      # none are needed to prove the code compiles. libunicorn.a's deployment-
      # version noise (AnisetteKit's prebuilt binary) is filtered from the live
      # log; the raw log keeps every line.
      - name: Build (Debug)
        id: build
        run: |
          set -uo pipefail
          xcodebuild \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            VEXSIGN_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$BUILD_LOG" \
              | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; } \
              | { grep -v -F 'libunicorn.a' || true; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild exited with status ${status} - see the annotations and the summary."
          fi
          exit "${status}"

      - name: Save Swift packages
        if: success() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}

      # Annotates errors/warnings inline, writes the summary and enforces the
      # warnings gate. Runs even when the build step failed so the diagnostics
      # are always visible.
      - name: Report diagnostics
        id: report
        if: always() && steps.build.outcome != 'skipped'
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          # Dispatch input wins, then the repository variable, then the default.
          WARNINGS_AS_ERRORS: ${{ github.event_name == 'workflow_dispatch' && inputs.warnings_as_errors || (vars.BUILD_WARNINGS_AS_ERRORS || 'true') }}
        run: |
          python3 .github/scripts/xcodebuild_report.py \
            --log "$BUILD_LOG" \
            --build-exit "${BUILD_EXIT:-1}" \
            --warnings-as-errors "$WARNINGS_AS_ERRORS" \
            --baseline .github/build-warnings-baseline.json \
            --baseline-out "$RUNNER_TEMP/build-warnings-baseline.json" \
            --workspace "$GITHUB_WORKSPACE"

      # Reuse the already-built device app: no second build, signing secrets,
      # release tag or publisher permissions are needed for a disposable test IPA.
      - name: Package unsigned test IPA
        run: |
          set -euo pipefail
          APP="${DERIVED_DATA}/Build/Products/Debug-iphoneos/VexSign.app"
          STAGING="${RUNNER_TEMP}/ci-ipa"
          test -f "${APP}/Info.plist"
          mkdir -p "${STAGING}/Payload"
          ditto "${APP}" "${STAGING}/Payload/VexSign.app"
          python3 - "${APP}/Info.plist" "${STAGING}/BUILD.json" <<'PY'
          import json, os, pathlib, plistlib, sys
          info_path = pathlib.Path(sys.argv[1])
          with info_path.open('rb') as handle:
              info = plistlib.load(handle)
          if info.get('DTPlatformName') != 'iphoneos':
              raise SystemExit('Refusing to package a non-device app as a test IPA')
          executable = info.get('CFBundleExecutable')
          if not executable or not (info_path.parent / executable).is_file():
              raise SystemExit('Built app executable is missing')
          metadata = {
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'configuration': 'Debug',
              'unsigned': True,
              'version': info.get('CFBundleShortVersionString'),
              'build': info.get('CFBundleVersion'),
              'notice': 'Temporary test build. Re-sign before installing. Check the separate simulator-test job; this artifact is not proof that tests passed.'
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          (
            cd "${STAGING}"
            ditto -c -k --keepParent Payload VexSign-unsigned.ipa
            shasum -a 256 VexSign-unsigned.ipa BUILD.json > SHA256SUMS
          )

      - name: Upload unsigned test IPA
        id: test_ipa
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VexSign-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-ipa/VexSign-unsigned.ipa
            ${{ runner.temp }}/ci-ipa/BUILD.json
            ${{ runner.temp }}/ci-ipa/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Test IPA download
        env:
          ARTIFACT_URL: ${{ steps.test_ipa.outputs.artifact-url }}
        run: |
          {
            echo '### Temporary unsigned IPA'
            printf '[Download the test build](%s)\n\n' "$ARTIFACT_URL"
            echo 'Debug device build; expires after 14 days. Re-sign with your own identity before installation.'
            echo 'This is not a release. Check the separate simulator-test job and the whole run conclusion before treating the commit as green.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Warnings appeared or disappeared compared to the committed baseline:
      # offer the regenerated file so it can be committed as
      # .github/build-warnings-baseline.json (after fixing what is new).
      - name: Upload regenerated warnings baseline
        if: always() && steps.report.outputs.baseline_changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-warnings-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-warnings-baseline.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload xcresult and log
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSign.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Do the tests pass? Host-only suite, unsigned simulator run: no certificates
  # exist on the runner and none are needed to exercise signing *logic*.
  # ---------------------------------------------------------------------------
  tests:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' && (github.event_name != 'workflow_dispatch' || inputs.validation != 'quick') && needs.quick.outputs.native == 'true'
    name: tests · VexSignTests (simulator)
    needs: quick
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSignTests.xcresult"
            echo "TEST_LOG=${RUNNER_TEMP}/xcodebuild-test.log"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Read the same cache as the build job; the build job owns cache writes.
      - name: Restore Swift packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-${{ runner.os }}-

      # The destination is resolved at run time: runner images change the
      # installed simulator set with every Xcode update, and a hard-coded name
      # is the usual reason a test job starts failing on a day nothing changed.
      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          line="$(python3 .github/scripts/select_simulator.py)"
          udid="${line##* }"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${line}"

      # Filter only the known libunicorn.a deployment-version lines from the
      # live log (see the build step); $TEST_LOG keeps every line.
      - name: Run tests
        id: test
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -uo pipefail
          xcodebuild \
            -workspace VexSign.xcworkspace \
            -scheme VexSignTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:VexSignTests \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 2 \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            VEXSIGN_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee "$TEST_LOG" \
              | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; } \
              | { grep -v -F 'libunicorn.a' || true; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild test exited with status ${status} - see the annotations, the summary and the uploaded xcresult."
          fi
          exit "${status}"

      # Newer Xcode files per-test results in the xcresult, not in stdout:
      # surface failing tests, crash stacks and log context as annotations
      # (complete lists stay in the step log).
      - name: Surface failures
        if: failure()
        continue-on-error: true
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/VexSignTests.xcresult
          TEST_LOG: ${{ runner.temp }}/xcodebuild-test.log
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
          SUMMARY_JSON: ${{ runner.temp }}/summary.json
        run: python3 .github/scripts/surface_test_failures.py

      - name: Report diagnostics
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        env:
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
        run: |
          if [ ! -f "$TEST_LOG" ]; then
            echo "::warning::No xcodebuild log was produced."
            exit 0
          fi
          python3 .github/scripts/xcodebuild_report.py \
            --log "$TEST_LOG" \
            --build-exit "${TEST_EXIT:-1}" \
            --warnings-as-errors false \
            --title "Tests" \
            --workspace "$GITHUB_WORKSPACE"

      # The shared VexSignTests scheme enables code coverage. Report the overall
      # number and the least-covered first-party files so test work (and the
      # try?/singleton burn-down) can be targeted instead of guessed at.
      # Reporting only: this never turns a passing test run red.
      - name: Report coverage
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        run: |
          python3 .github/scripts/coverage_report.py \
            --result-bundle "$RESULT_BUNDLE" \
            --json "${RUNNER_TEMP}/coverage.json"

      - name: Upload coverage report
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: ignore
          retention-days: 3

      # A failure is usually a destination or embedding problem, not an
      # assertion. Print what this runner actually offers.
      - name: Show available destinations
        if: failure()
        run: xcodebuild -workspace VexSign.xcworkspace -scheme VexSignTests -showdestinations || true

      - name: Upload xcresult and log
        if: failure() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSignTests.xcresult
            ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 3
