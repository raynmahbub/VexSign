name: CI

# Answers "is this commit good?" for every relevant push and PR.
#
#   quick   ~1 min · Linux: Swift syntax, resources, project
#           structure and the repo gates in Tools/. `Tools/Validation/repository-validation/ci-scope.py` then
#           decides whether the macOS jobs are needed (portable-only diffs,
#           e.g. docs or Tools/*.py, skip them). Docs-only changes never
#           start this workflow at all — see docs.yml.
#   build   macOS · unsigned Debug and Release builds, static analyzer, warnings
#           gate (baseline in .github/build-warnings-baseline.json), 14-day test IPA.
#   tests   macOS · simulator unit/integration tests plus a quality report built
#           from xcresult leaf results. A skipped suite is never a pass.
#   ui-tests macOS · simulator XCUITest target for taps, navigation and swipes.
#           Separate result bundle, screenshots and quality report; never hardware.
#   concurrency  macOS · `make strict-concurrency`, the only check that
#           compiles the first-party packages with complete concurrency
#           diagnostics. Report-only for now; see the job comment.
#   device  self-hosted iPhone runner · install, launch and optional native tests
#           on real hardware. Never runs for a pull request and never on a
#           GitHub-hosted runner. Requires explicit variables/secrets below.
#
# Not here: publishing (release.yml), companion SDKs (platform-check.yml),
# Python/TypeScript services (services.yml), SwiftLint (`make lint` locally).
#
# Knobs (Settings → Secrets and variables → Actions → Variables):
#   BUILD_XCODE               Xcode version prefix ("26.3"). Empty = newest on
#                             the runner; the code needs the iOS 26 SDK.
#   BUILD_WARNINGS_AS_ERRORS  "true" (default, baseline tolerated) · "strict"
#                             (every warning fails) · "false" (report only).
#   VEXSIGN_PRIVATE_MACOS_VALIDATION=true  allow paid macOS jobs on a private repo.
#   VEXSIGN_DEVICE_RUNNER=true             enable the self-hosted device job.
#   VEXSIGN_DEVICE_UDID                    UDID of the connected iPhone.
#   VEXSIGN_DEVICE_IPA                     path to a development-signed IPA on the runner.
#   VEXSIGN_DEVICE_RUN_TESTS=true          also run VexSignTests on the device.
#   Secret VEXSIGN_DEVICE_SIGNING_IDENTITY development certificate for that IPA.

on:
  push:
    branches: [main]
    paths:
      - 'VexSign/App/**'
      - 'VexSign/Features/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'VexSign/Shared/**'
      - 'VexSign/Storage/**'
      - 'VexSign/Networking/**'
      - 'VexSign/System/**'
      - 'VexSign/Security/**'
      - 'VexSign/DesignSystem/**'
      - 'VexSign/Resources/**'
      - 'VexSign/Services/**'
      - 'Platform/Extensions/WidgetExtension/**'
      - 'VexSign/Resources/SharedPlatformInfo/**'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - 'Packages/NimbleKit/**'
      - 'Packages/AltSourceKit/**'
      - 'Packages/Vendor/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'

      # Published root compatibility aliases: changes must run the alias gate.
      - 'app-repo.json'
      - 'repos.json'
      - 'icon.png'
      - 'license_plist.yml'
      - 'render.yaml'
      - 'Tools/Audit/**'
      - 'Tools/**'
      - 'VexSign/App/**'
      - 'VexSign/Features/**'
      - 'Packages/**'
      - 'Services/Integrations/**'
      - 'Resources/**'
      - 'Services/Integrations/*.py'
      - 'Services/Integrations/tests/**'
      - 'Services/Integrations/HostOverlay/**'
      - 'Services/Integrations/patches/**'
      - 'Services/Integrations/inputs.lock.json'
      - 'Packages/NativeSigning/**'
      - 'Packages/SideSign/**'
      - '.github/scripts/**'
      - '.github/build-warnings-baseline.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-repair-assistant.yml'
      - 'Configuration/**'
  pull_request:
    branches: [main]
    paths:
      - 'VexSign/App/**'
      - 'VexSign/Features/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'VexSign/Shared/**'
      - 'VexSign/Storage/**'
      - 'VexSign/Networking/**'
      - 'VexSign/System/**'
      - 'VexSign/Security/**'
      - 'VexSign/DesignSystem/**'
      - 'VexSign/Resources/**'
      - 'VexSign/Services/**'
      - 'Platform/Extensions/WidgetExtension/**'
      - 'VexSign/Resources/SharedPlatformInfo/**'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - 'Packages/NimbleKit/**'
      - 'Packages/AltSourceKit/**'
      - 'Packages/Vendor/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'

      # Published root compatibility aliases: changes must run the alias gate.
      - 'app-repo.json'
      - 'repos.json'
      - 'icon.png'
      - 'license_plist.yml'
      - 'render.yaml'
      - 'Tools/Audit/**'
      - 'Tools/**'
      - 'VexSign/App/**'
      - 'VexSign/Features/**'
      - 'Packages/**'
      - 'Services/Integrations/**'
      - 'Resources/**'
      - 'Services/Integrations/*.py'
      - 'Services/Integrations/tests/**'
      - 'Services/Integrations/HostOverlay/**'
      - 'Services/Integrations/patches/**'
      - 'Services/Integrations/inputs.lock.json'
      - 'Packages/NativeSigning/**'
      - 'Packages/SideSign/**'
      - '.github/scripts/**'
      - '.github/build-warnings-baseline.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-repair-assistant.yml'
      - 'Configuration/**'
  workflow_dispatch:
    inputs:
      validation:
        description: 'quick: Linux checks only; full: checks, unsigned build and simulator tests'
        type: choice
        options: [full, quick]
        default: full
        required: true
      xcode:
        description: 'Xcode version prefix (e.g. "26.3", "16.4"). Empty = BUILD_XCODE variable or newest installed.'
        required: false
        default: ''
      warnings_as_errors:
        description: 'First-party warnings: true = fail on new ones (baseline tolerated), strict = fail on all, false = report only'
        type: choice
        options: ['true', 'strict', 'false']
        required: false
        default: 'true'
      device:
        description: 'Run the physical-device job on a configured self-hosted iPhone runner'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A superseded push to a pull request should stop: the newest commit is the one under
# review. A push to main is the opposite — those commits are already merged, and cancelling the
# run destroys the only validation that commit will ever get. On main the group is therefore
# keyed by SHA, so consecutive merges queue independently instead of replacing each other.
# (Before this, runs 370-386 on main were all cancelled and main had no completed CI.)
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: everything that can be decided without Xcode.
  # ---------------------------------------------------------------------------
  quick:
    # Not gated on public visibility, unlike the macOS jobs: it consumes no paid
    # runner minutes, and gating it meant a private repository (or a private fork)
    # silently skipped every validation while the check went green.
    name: quick · syntax, resources, gates
    outputs:
      native: ${{ steps.scope.outputs.native }}
    # Pinned, not `ubuntu-latest`. The image ships both tools this job needs
    # (Swift 6.4.2 and Python 3.12.3), so no container is required -- see the
    # toolchain step for why relying on one proved fragile.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # ci-scope diffs the whole PR/push against its base

      - name: Toolchain and scope
        id: scope
        run: |
          set -u
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Both are provided by the runner image and asserted, not assumed: the previous
          # revision ran this job in a swift container that does not ship python3, and
          # discovering that cost a pipeline cycle every time.
          swiftc --version || {
            echo "::error::swiftc is missing from the runner image; the ubuntu-24.04 image is expected to provide Swift 6.4.x."
            exit 1
          }
          python3 --version || {
            echo "::error::python3 is missing from the runner image; the ubuntu-24.04 image is expected to provide Python 3.12."
            exit 1
          }

          python3 Tools/Validation/repository-validation/ci-scope.py

      # swiftc -parse on every first-party file, duplicate types/file names,
      # broken plists/xcstrings, layout/script sanity — plus its own regressions.
      - name: Quick check
        run: |
          python3 .github/scripts/quick_check.py --self-test
          python3 .github/scripts/quick_check.py --root . --json "$RUNNER_TEMP/quick-check.json"

      # Deeper Xcode project structure (no Xcode needed) and the frozen
      # repository gates: localisation, error discipline, singleton freeze,
      # concurrency escapes.
      - name: Repository gates
        run: |
          python3 Tools/Validation/repository-validation/check-pbxproj.py
          python3 Tools/Validation/repository-validation/check-package-graph.py
          python3 Tools/Validation/repository-validation/sync_repo_aliases.py --check
          python3 Tools/Validation/repository-validation/test_repo_aliases.py
          python3 Tools/Validation/architecture-rules/test_repository_layout.py
          python3 Tools/Validation/repository-validation/sync-strings.py --check
          # Coverage, not just key presence: 12 locales are declared and each is
          # about a fifth translated. The table goes to the run summary so the gap is
          # visible before someone adds a thirteenth locale.
          python3 Tools/Validation/repository-validation/sync-strings.py --report --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 Tools/Validation/repository-validation/test_sync_strings.py
          python3 Tools/Validation/security-validation/error-discipline.py
          python3 Tools/Validation/security-validation/singleton-freeze.py
          python3 Tools/Validation/security-validation/concurrency-discipline.py
          # Uncaught detached work is invisible to strict concurrency; the inventory is the
          # only place a new site shows up before a device does.
          python3 Tools/Validation/repository-validation/test_detached_task_audit.py
          # A count is not a reason: every escape needs its invariant on record.
          python3 Tools/Validation/security-validation/test_concurrency_audit.py --self-test
          python3 Tools/Validation/security-validation/test_concurrency_audit.py
          python3 Tools/Validation/security-validation/test_swift6_native_regressions.py
          python3 Tools/Validation/security-validation/test_device_foundation.py
          python3 Tools/Validation/security-validation/test_install_monitoring_policy.py
          python3 Tools/Validation/security-validation/check-native-handoff.py
          # The CMS fixture is generated elsewhere (OpenSSL) and must keep
          # conforming to the subset the parser accepts; drift fails here.
          python3 Packages/NativeSigning/Fixtures/make_cms_fixture.py --check

      # Exercise the real C++ engine with synthetic Mach-O/CMS data. No Apple
      # credentials or device result is inferred; the iOS Security bridge remains
      # in the simulator test job. Normal CI never rewrites the public fixture.
      - name: Native signing core · ASan and UBSan
        env:
          VEXSIGN_NATIVE_SANITIZERS: '1'
        run: |
          set -euo pipefail
          pkg-config --atleast-version=3 openssl || {
            echo "::error::OpenSSL 3 development files are required on ubuntu-24.04."
            exit 1
          }
          python3 Tools/Validation/security-validation/test_native_signing_core.py

      # swiftformat for consistent code style. The runner image ships Swift but not
      # the formatter, so the pinned release is built once per run.
      - name: Install swiftformat
        run: |
          set -euo pipefail
          version=0.64.6
          if command -v swiftformat >/dev/null 2>&1; then
            swiftformat --version
            exit 0
          fi
          git clone --quiet --depth 1 --branch "$version" \
            https://github.com/nicklockwood/SwiftFormat.git "$RUNNER_TEMP/SwiftFormat"
          swift build --package-path "$RUNNER_TEMP/SwiftFormat" -c release --product swiftformat
          install "$RUNNER_TEMP/SwiftFormat/.build/release/swiftformat" /usr/local/bin/swiftformat
          swiftformat --version

      # Report-only, because 552 first-party files still indent with tabs: a whole-tree
      # lint would fail every pull request over code it never touched. The enforcing
      # halves are separate — `test_swift_indentation_ratchet.py` fails when the backlog
      # grows and when it shrinks without being recorded, and the changed-lines drift gate
      # below fails on the lines this diff owns. When the count reaches zero, replace this
      # step with `swiftformat --lint .` and delete the ratchet.
      #
      # Kept ahead of the drift gate below on purpose: this step always completes,
      # so the backlog count is still reported on a pull request the gate fails.
      - name: swiftformat lint (report)
        continue-on-error: true
        run: |
          swiftformat --lint . 2>&1 | tail -40

      # The enforcing half of the step above. A whole-tree lint cannot be a gate
      # while 268 first-party files are still tab-indented — it would fail every
      # pull request over code it never touched — but the lines a diff owns have no
      # backlog to inherit, so those can be gated today. Scope and per-line
      # ownership come from the same immutable base ci-scope.py uses; vendored
      # trees stay out of scope because .swiftformat excludes them.
      - name: Swift style drift (changed lines)
        run: |
          python3 Tools/Validation/repository-validation/check-swift-format-drift.py

      # README link check plus the offline regression suites.
      - name: Links and regressions
        run: |
          python3 Tools/Validation/repository-validation/check-docs.py
          python3 Tools/Validation/repository-validation/test_docs.py
          python3 Tools/Validation/repository-validation/check_project_wiring.py
          python3 Tools/Validation/repository-validation/test_project_wiring.py
          python3 Tools/Validation/repository-validation/check_regression_tests.py --self-test
          python3 Tools/Validation/repository-validation/check_regression_tests.py
          python3 Tools/Audit/test_integration_contracts.py
          python3 Tools/Validation/architecture-rules/test_architecture_boundaries.py
          python3 Tools/Validation/architecture-rules/test_feature_workspace_boundaries.py
          python3 Tools/Validation/architecture-rules/test_architecture_excellence.py
          python3 Tools/Validation/repository-validation/test_ci_repair_agent.py
          python3 Tools/Audit/test_device_acceptance.py
          python3 Tools/Audit/test_feature_acceptance.py
          python3 Tools/Audit/test_quality_report.py
          python3 Tools/Audit/test_combined_report.py
          python3 Tools/Audit/test_ui_test_target.py
          python3 Tools/Release/test_verify_ci_gate.py
          python3 Tools/Validation/security-validation/test_native_promotion_evidence.py
          python3 Tools/Validation/security-validation/test_private_defaults_policy.py
          python3 Tools/Validation/security-validation/test_archive_extraction_policy.py
          python3 Tools/Validation/security-validation/test_webmanager_wiring.py
          python3 Tools/Validation/security-validation/test_network_timeout_policy.py
          python3 Tools/Audit/test_cloud_signing_contract.py
          python3 Tools/Audit/test_task_history_resilience.py
          python3 Tools/Validation/security-validation/test_capability_disclosure.py
          python3 Tools/Validation/security-validation/test_logging_message_policy.py
          python3 Tools/Validation/security-validation/test_cross_file_privacy.py
          python3 Tools/Release/test_release_assets.py
          python3 Tools/Validation/repository-validation/test_autopilot.py
          python3 Tools/Validation/repository-validation/test_workflow_policy.py
          python3 Tools/Validation/repository-validation/test_workflow_trace_policy.py
          python3 Tools/Validation/repository-validation/test_build_provenance.py
          python3 Tools/Validation/repository-validation/test_package_graph.py
          python3 Tools/Validation/repository-validation/test_coverage_report.py
          python3 Tools/Validation/repository-validation/test_swift6_build_regressions.py
          # Same job that runs the swiftformat step above, so the configs it depends on are
          # checked here: the report-only lint is only meaningful while the formatter, the editor
          # config and the lint scope still agree.
           python3 Tools/Validation/repository-validation/test_style_config.py
           # The drift gate's own regressions: hunk ownership, the formatter's JSON
           # report schema and the vendored excludes. It runs here rather than in the
           # gate step so the gate's logic is checked even on a diff that touches no
           # Swift, where the gate itself has nothing to do.
           python3 Tools/Validation/repository-validation/test_swift_format_drift.py
          # The runtime each service is tested on, built into and deployed with. Four workflows pin
          # `python-version` and one pins `node-version`, while the images and render.yaml declare
          # their own; this asserts every one of those still names the same interpreter.
          python3 Tools/Validation/repository-validation/test_runtime_policy.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-check.json
          if-no-files-found: ignore
          retention-days: 3

      # The macOS jobs below are gated on public visibility so a private mirror cannot spend the
      # project's macOS runner budget (see `test_workflow_policy.py::test_free_only_workflow_policy`).
      # A trusted private repository can opt in with the repository variable
      # VEXSIGN_PRIVATE_MACOS_VALIDATION=true and accept the billed minutes. A job that never
      # starts leaves nothing in the check list but its absence, so say it here: a green pull
      # request from a private fork must not read as a validated one.
      - name: Say that the macOS jobs are skipped
        if: (github.event.repository.private == true || github.event.repository.visibility != 'public') && vars.VEXSIGN_PRIVATE_MACOS_VALIDATION != 'true'
        run: |
          {
            echo "### macOS build and tests were skipped"
            echo
            echo "This repository is private and has not opted in, so \`build\`, \`tests\`,"
            echo "\`concurrency\` and the platform builds did not start — they are paid-runner jobs."
            echo "The portable gates in this job ran. Nothing here compiled the Swift in this change."
            echo
            echo "To validate here, set the repository variable VEXSIGN_PRIVATE_MACOS_VALIDATION=true"
            echo "and re-run the workflow, or validate in a public fork."
            echo
            echo "Policy: \`Tools/Validation/repository-validation/test_workflow_policy.py\`,"
            echo "\`test_free_only_workflow_policy\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=macOS validation skipped::private repository; the app was not built and its tests did not run"

  # ---------------------------------------------------------------------------
  # Does it compile?
  # ---------------------------------------------------------------------------
  build:
    if: >-
      (github.event.repository.private == false && github.event.repository.visibility == 'public' || vars.VEXSIGN_PRIVATE_MACOS_VALIDATION == 'true') && (github.event_name != 'workflow_dispatch' || inputs.validation != 'quick') && needs.quick.outputs.native == 'true'
    name: build · VexSign Debug (unsigned)
    needs: quick
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The `runner` context is not available in job-level env, so the scratch
      # paths are exported from a step instead.
      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RELEASE_DERIVED_DATA=${RUNNER_TEMP}/DerivedDataRelease"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSign.xcresult"
            echo "RELEASE_RESULT_BUNDLE=${RUNNER_TEMP}/VexSignRelease.xcresult"
            echo "BUILD_LOG=${RUNNER_TEMP}/xcodebuild.log"
            echo "RELEASE_BUILD_LOG=${RUNNER_TEMP}/xcodebuild-release.log"
            echo "ANALYZE_LOG=${RUNNER_TEMP}/xcodebuild-analyze.log"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Package checkouts are shared with the test job. Only this job saves the
      # cache, avoiding competing post-job uploads when both runners finish.
      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-v2-${{ runner.os }}-

      - name: Release manifest signer tests
        run: node --test Tools/Release/test-release-manifest.mjs

      # Unsigned generic iOS build: no certificates exist on the runner and
      # none are needed to prove the code compiles. libunicorn.a's deployment-
      # version noise (AnisetteKit's prebuilt binary) is filtered from the live
      # log; the raw log keeps every line.
      - name: Build (Debug)
        id: build
        run: |
          # Actions starts bash with -e. Capture the real xcodebuild verdict
          # before exiting so diagnostics never receive an "unknown" status.
          set +e
          set -uo pipefail
          # `licenseplist` ships a build-tool plugin that Xcode wants a human to
          # approve; the approval is per-user DerivedData, so a runner can never
          # have it. The plugin still runs; only the trust prompt is skipped. Same
          # flag as the Makefile targets, and the package is pinned exactly.
          xcodebuild \
            -skipPackagePluginValidation \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            VEXSIGN_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$BUILD_LOG" \
              | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; } \
              | { grep -v -F 'libunicorn.a' || true; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild exited with status ${status} - see the annotations and the summary."
          fi
          exit "${status}"

      - name: Save Swift packages
        if: success() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}

      # Debug compilation is necessary but not sufficient: optimised Release builds
      # routinely surface different type-checker, linker and resource problems. Build
      # it on every native change, unsigned, with its own DerivedData and result bundle.
      - name: Build (Release)
        id: release_build
        run: |
          set +e
          set -uo pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RELEASE_DERIVED_DATA" \
            -resultBundlePath "$RELEASE_RESULT_BUNDLE" \
            VEXSIGN_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RELEASE_BUILD_LOG" \
              | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; } \
              | { grep -v -F 'libunicorn.a' || true; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::Release xcodebuild exited with status ${status}; see the Release build log."
          fi
          exit "${status}"

      # Static analyser findings are compile-time bugs, not style preferences. This is a
      # blocking step: a new analyzer defect should fail the pull request that introduced it.
      - name: Static analyzer
        id: analyze
        run: |
          set +e
          set -uo pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            VEXSIGN_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            analyze 2>&1 | tee "$ANALYZE_LOG" \
              | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; } \
              | { grep -v -F 'libunicorn.a' || true; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::Static analyzer exited with status ${status}; see the analyzer log."
          fi
          exit "${status}"

      # Annotates errors/warnings inline, writes the summary and enforces the
      # warnings gate. Runs even when the build step failed so the diagnostics
      # are always visible.
      - name: Report diagnostics
        id: report
        if: always() && steps.build.outcome != 'skipped'
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          # Dispatch input wins, then the repository variable, then the default.
          WARNINGS_AS_ERRORS: ${{ github.event_name == 'workflow_dispatch' && inputs.warnings_as_errors || (vars.BUILD_WARNINGS_AS_ERRORS || 'true') }}
        run: |
          python3 .github/scripts/xcodebuild_report.py \
            --log "$BUILD_LOG" \
            --build-exit "${BUILD_EXIT:-1}" \
            --warnings-as-errors "$WARNINGS_AS_ERRORS" \
            --baseline .github/build-warnings-baseline.json \
            --baseline-out "$RUNNER_TEMP/build-warnings-baseline.json" \
            --workspace "$GITHUB_WORKSPACE"

      # Reuse the already-built device app: no second build, signing secrets,
      # release tag or publisher permissions are needed for a disposable test IPA.
      - name: Package unsigned test IPA
        run: |
          set -euo pipefail
          APP="${DERIVED_DATA}/Build/Products/Debug-iphoneos/VexSign.app"
          STAGING="${RUNNER_TEMP}/ci-ipa"
          test -f "${APP}/Info.plist"
          # A .deb uses the AR container format but is a runtime resource, not
          # a Mach-O static library. Prove the file-type repair still bundles it.
          if ! cmp -s "${GITHUB_WORKSPACE}/VexSign/Resources/ellekit.deb" "${APP}/ellekit.deb"; then
            echo "::error::Built app must bundle the original ellekit.deb as a byte-identical resource."
            exit 1
          fi
          mkdir -p "${STAGING}/Payload"
          ditto "${APP}" "${STAGING}/Payload/VexSign.app"
          python3 - "${APP}/Info.plist" "${STAGING}/BUILD.json" <<'PY'
          import json, os, pathlib, plistlib, sys
          info_path = pathlib.Path(sys.argv[1])
          with info_path.open('rb') as handle:
              info = plistlib.load(handle)
          if info.get('DTPlatformName') != 'iphoneos':
              raise SystemExit('Refusing to package a non-device app as a test IPA')
          executable = info.get('CFBundleExecutable')
          if not executable or not (info_path.parent / executable).is_file():
              raise SystemExit('Built app executable is missing')
          metadata = {
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'configuration': 'Debug',
              'unsigned': True,
              'version': info.get('CFBundleShortVersionString'),
              'build': info.get('CFBundleVersion'),
              'notice': 'Temporary test build. Re-sign before installing. Check the separate simulator-test job; this artifact is not proof that tests passed.'
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          (
            cd "${STAGING}"
            ditto -c -k --keepParent Payload VexSign-unsigned.ipa
            python3 "${GITHUB_WORKSPACE}/Tools/Release/release-build-version.py" --check-container VexSign-unsigned.ipa
            shasum -a 256 VexSign-unsigned.ipa BUILD.json > SHA256SUMS
          )

      - name: Upload unsigned test IPA
        id: test_ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VexSign-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-ipa/VexSign-unsigned.ipa
            ${{ runner.temp }}/ci-ipa/BUILD.json
            ${{ runner.temp }}/ci-ipa/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Test IPA download
        env:
          ARTIFACT_URL: ${{ steps.test_ipa.outputs.artifact-url }}
        run: |
          {
            echo '### Temporary unsigned IPA'
            printf '[Download the test build](%s)\n\n' "$ARTIFACT_URL"
            echo 'Debug device build; expires after 14 days. Re-sign with your own identity before installation.'
            echo 'This is not a release. Check the separate simulator-test job and the whole run conclusion before treating the commit as green.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Warnings appeared or disappeared compared to the committed baseline:
      # offer the regenerated file so it can be committed as
      # .github/build-warnings-baseline.json (after fixing what is new).
      - name: Upload regenerated warnings baseline
        if: always() && steps.report.outputs.baseline_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-warnings-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-warnings-baseline.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload xcresult and log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSign.xcresult
            ${{ runner.temp }}/VexSignRelease.xcresult
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild-release.log
            ${{ runner.temp }}/xcodebuild-analyze.log
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Do the tests pass? Host-only suite with a local ad-hoc simulator signature.
  # No Apple identity/profile is needed, but Keychain integration tests require
  # the simulator host to have signed entitlements (unsigned returns -34018).
  # ---------------------------------------------------------------------------
  tests:
    if: >-
      (github.event.repository.private == false && github.event.repository.visibility == 'public' || vars.VEXSIGN_PRIVATE_MACOS_VALIDATION == 'true') && (github.event_name != 'workflow_dispatch' || inputs.validation != 'quick') && needs.quick.outputs.native == 'true'
    name: tests · VexSignTests (simulator)
    needs: quick
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSignTests.xcresult"
            echo "TEST_LOG=${RUNNER_TEMP}/xcodebuild-test.log"
            echo "TEST_RESULTS_JSON=${RUNNER_TEMP}/test-results.json"
            echo "QUALITY_JSON=${RUNNER_TEMP}/quality-report.json"
            echo "QUALITY_MD=${RUNNER_TEMP}/quality-report.md"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # The quick gate runs on Linux, where there is no swiftc, so its syntax parse is
      # skipped and a green run says nothing about the Swift it never read. This job has
      # the toolchain: parse every first-party module here, before the slower test build,
      # and make a missing toolchain fatal instead of a warning.
      - name: Swift syntax parse · every module
        run: |
          SWIFTC="$(xcrun --find swiftc)" python3 .github/scripts/quick_check.py --root . --require-swiftc

      # Isolated macOS tests compile the exact production foundation sources.
      # No IDevice binary, network service, account, signing identity or iPhone.
      - name: Device foundation · parser, storage and executor
        run: |
          # Preserve the native verdict and publish compiler diagnostics as
          # annotations too; artifacts alone are not always reachable by reviewers.
          set +e
          set -uo pipefail
          make test-device-foundation 2>&1 | tee "$RUNNER_TEMP/device-foundation-tests.log"
          status=${PIPESTATUS[0]}
          python3 .github/scripts/xcodebuild_report.py \
            --log "$RUNNER_TEMP/device-foundation-tests.log" \
            --build-exit "$status" \
            --warnings-as-errors false \
            --title "Device foundation" \
            --workspace "$GITHUB_WORKSPACE"
          report_status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report_status"

      - name: Upload device foundation findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/device-foundation-tests.log
            .build/device-foundation/source-hashes.json
          if-no-files-found: warn
          retention-days: 3

      # Read the same cache as the build job; the build job owns cache writes.
      - name: Restore Swift packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-v2-${{ runner.os }}-

      # The destination is resolved at run time: runner images change the
      # installed simulator set with every Xcode update, and a hard-coded name
      # is the usual reason a test job starts failing on a day nothing changed.
      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          line="$(python3 .github/scripts/select_simulator.py)"
          udid="${line##* }"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${line}"

      # Filter only the known libunicorn.a deployment-version lines from the
      # live log (see the build step); $TEST_LOG keeps every line.
      - name: Run tests
        id: test
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          # Actions starts bash with -e. Capture the real xcodebuild verdict
          # before exiting so diagnostics never receive an "unknown" status.
          set +e
          set -uo pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -workspace VexSign.xcworkspace \
            -scheme VexSignTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:VexSignTests \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 2 \
            -enableCodeCoverage YES \
            VEXSIGN_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee "$TEST_LOG" \
              | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; } \
              | { grep -v -F 'libunicorn.a' || true; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild test exited with status ${status} - see the annotations, the summary and the uploaded xcresult."
          fi
          exit "${status}"

      # Newer Xcode files per-test results in the xcresult, not in stdout:
      # surface failing tests, crash stacks and log context as annotations
      # (complete lists stay in the step log).
      - name: Surface failures
        if: failure() && steps.test.outcome != 'skipped'
        continue-on-error: true
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/VexSignTests.xcresult
          TEST_LOG: ${{ runner.temp }}/xcodebuild-test.log
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
          SUMMARY_JSON: ${{ runner.temp }}/summary.json
        run: python3 .github/scripts/surface_test_failures.py

      - name: Report diagnostics
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        env:
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
        run: |
          if [ ! -f "$TEST_LOG" ]; then
            echo "::warning::No xcodebuild log was produced."
            exit 0
          fi
          python3 .github/scripts/xcodebuild_report.py \
            --log "$TEST_LOG" \
            --build-exit "${TEST_EXIT:-1}" \
            --warnings-as-errors false \
            --title "Tests" \
            --workspace "$GITHUB_WORKSPACE"

      # The authoritative "did tests actually run?" gate. xcodebuild can exit 0 with
      # an empty or all-skipped suite; this reads leaf results from the xcresult and
      # fails when nothing executed or any test failed. It runs even when the test
      # step failed, so the summary always records what really happened.
      - name: Quality report
        id: quality
        if: always() && steps.test.outcome != 'skipped'
        run: |
          set +e
          set -uo pipefail
          if [ -d "$RESULT_BUNDLE" ]; then
            xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" --format json > "$TEST_RESULTS_JSON"
          fi
          python3 Tools/Audit/quality-report.py \
            --test-results "$TEST_RESULTS_JSON" \
            --test-log "$TEST_LOG" \
            --json "$QUALITY_JSON" \
            --markdown "$QUALITY_MD" \
            --github-output "$GITHUB_OUTPUT"
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo "::error::Quality report failed; no passing simulator suite is claimed."
          fi
          exit "${status}"

      - name: Publish quality summary
        if: always() && steps.quality.outcome != 'skipped'
        run: |
          if [ -f "$QUALITY_MD" ]; then
            cat "$QUALITY_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality report
        if: always() && steps.quality.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quality-report.json
            ${{ runner.temp }}/quality-report.md
            ${{ runner.temp }}/test-results.json
          if-no-files-found: warn
          retention-days: 3

      # The shared VexSignTests scheme enables code coverage, and `-enableCodeCoverage
      # YES` above repeats it on the command line because the scheme setting alone has
      # been lost before: this step used to log "Could not read coverage … skipping" on
      # every run, leaving an empty artifact and no least-covered list.
      #
      # Reporting only: a low number never turns a passing test run red. A *missing*
      # number is different — coverage_report.py exits 1 so this step turns orange with
      # xccov's own message, instead of looking like a clean step that did nothing.
      - name: Report coverage
        id: coverage
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        run: |
          # The baseline turns the number into a trend. It is recorded from a green run
          # (--update-baseline) and committed; a null baseline prints no delta rather than a
          # made-up one, so the first run after this change is not a regression.
          python3 .github/scripts/coverage_report.py \
            --result-bundle "$RESULT_BUNDLE" \
            --json "${RUNNER_TEMP}/coverage.json" \
            --fail-under 20 \
            --baseline Tools/Validation/repository-validation/coverage-baseline.json \
            --github-output "$GITHUB_OUTPUT"

      # The floor, as its own step so a *missing* number keeps the tolerant behaviour above
      # (orange, with xccov's own message) while a *measured* number below the floor turns the
      # job red. Twenty percent is a collapse detector, not a quality bar: a suite that stops
      # running, or a target dropped from the scheme, lands here. Raise it after reading a real
      # run rather than by guessing, and lower it only as a deliberate change to this file.
      - name: Coverage floor
        if: always() && steps.coverage.outputs.floor_status == 'below_floor'
        env:
          PERCENT: ${{ steps.coverage.outputs.percent }}
          FLOOR: ${{ steps.coverage.outputs.floor }}
        run: |
          echo "::error::Line coverage ${PERCENT}% is below the ${FLOOR}% floor."
          exit 1

      - name: Upload coverage report
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage.json
          # Longer than every other artifact: this is a trend, not a failure log, and the
          # least-covered list is only useful while the previous run is still there.
          if-no-files-found: ignore
          retention-days: 30

      # A failure is usually a destination or embedding problem, not an
      # assertion. Print what this runner actually offers.
      - name: Show available destinations
        if: failure() && steps.test.outcome != 'skipped'
        run: xcodebuild -workspace VexSign.xcworkspace -scheme VexSignTests -showdestinations || true

      - name: Upload xcresult and log
        if: failure() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSignTests.xcresult
            ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Real UI interactions on the simulator. This is a separate target and a
  # separate check: its screenshots are evidence of what the simulator showed,
  # not proof of an iOS install or a physical-device acceptance flow.
  # ---------------------------------------------------------------------------
  ui-tests:
    if: >-
      (github.event.repository.private == false && github.event.repository.visibility == 'public' || vars.VEXSIGN_PRIVATE_MACOS_VALIDATION == 'true') && (github.event_name != 'workflow_dispatch' || inputs.validation != 'quick') && needs.quick.outputs.native == 'true'
    name: ui-tests · VexSignUITests (simulator)
    needs: quick
    runs-on: macos-15
    # This job compiles the app from scratch in its own DerivedData. macOS
    # arm64 runners have been queueing for long stretches; 45m killed a run
    # before any UI test could execute, which is a blocked result, not a pass.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/UIDerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSignUITests.xcresult"
            echo "TEST_LOG=${RUNNER_TEMP}/xcodebuild-ui-test.log"
            echo "TEST_RESULTS_JSON=${RUNNER_TEMP}/ui-test-results.json"
            echo "QUALITY_JSON=${RUNNER_TEMP}/ui-quality-report.json"
            echo "QUALITY_MD=${RUNNER_TEMP}/ui-quality-report.md"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      - name: Restore Swift packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/UIDerivedData/SourcePackages
          key: spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-v2-${{ runner.os }}-

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          line="$(python3 .github/scripts/select_simulator.py)"
          udid="${line##* }"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${line}"

      # UI tests must not run in parallel workers: each worker would launch its
      # own copy of the app and steal taps from the other suite.
      - name: Run UI tests
        id: test
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set +e
          set -uo pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -workspace VexSign.xcworkspace \
            -scheme VexSignUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:VexSignUITests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            VEXSIGN_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee "$TEST_LOG" \
              | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; } \
              | { grep -v -F 'libunicorn.a' || true; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::XCUITest xcodebuild exited with status ${status}; see the uploaded xcresult and screenshots."
          fi
          exit "${status}"

      - name: Surface UI failures
        if: failure() && steps.test.outcome != 'skipped'
        continue-on-error: true
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/VexSignUITests.xcresult
          TEST_LOG: ${{ runner.temp }}/xcodebuild-ui-test.log
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
          SUMMARY_JSON: ${{ runner.temp }}/ui-summary.json
        run: python3 .github/scripts/surface_test_failures.py

      # The same leaf-result gate as the unit job. A skipped or never-run UI
      # target cannot be reported as a pass, and screenshots stay in the bundle.
      - name: UI quality report
        id: quality
        if: always() && steps.test.outcome != 'skipped'
        run: |
          set +e
          set -uo pipefail
          if [ -d "$RESULT_BUNDLE" ]; then
            xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" --format json > "$TEST_RESULTS_JSON"
          fi
          python3 Tools/Audit/quality-report.py \
            --test-results "$TEST_RESULTS_JSON" \
            --test-log "$TEST_LOG" \
            --json "$QUALITY_JSON" \
            --markdown "$QUALITY_MD" \
            --github-output "$GITHUB_OUTPUT"
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo "::error::UI quality report failed; no unexecuted UI test is claimed as passed."
          fi
          exit "${status}"

      - name: Publish UI quality summary
        if: always() && steps.quality.outcome != 'skipped'
        run: |
          if [ -f "$QUALITY_MD" ]; then
            cat "$QUALITY_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Upload on every attempt, not only failure: passing runs keep the
      # screenshots XCUITest attached, so a later UI regression has evidence to
      # compare against.
      - name: Upload UI xcresult, screenshots and report
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSignUITests.xcresult
            ${{ runner.temp }}/xcodebuild-ui-test.log
            ${{ runner.temp }}/ui-test-results.json
            ${{ runner.temp }}/ui-quality-report.json
            ${{ runner.temp }}/ui-quality-report.md
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # What still breaks under complete concurrency checking?
  # ---------------------------------------------------------------------------
  # `Tools/Validation/security-validation/concurrency-discipline.py` in the quick job is a counting gate: it
  # stops escapes from spreading but proves nothing about isolation. This is the
  # compiler half, and it can only run on macOS — AltSourceKit imports SwiftUI.
  #
  # Report-only on purpose: the diagnostics step carries `continue-on-error`, so
  # a package that is mid-cleanup cannot fail the PR. Its first job is to produce
  # a real diagnostic list for a branch that is still being cleaned up, and a
  # report that can page someone is a report nobody keeps running. Drop the
  # `continue-on-error` to promote it to a gate once it is green on main.
  #
  # `make strict-concurrency` passes `-strict-concurrency=complete` and no
  # `-warnings-as-errors`, because swiftc has no `-warnings-as-errors=false` and
  # that argument used to fail the target before it compiled anything.
  concurrency:
    if: >-
      (github.event.repository.private == false && github.event.repository.visibility == 'public' || vars.VEXSIGN_PRIVATE_MACOS_VALIDATION == 'true') && (github.event_name != 'workflow_dispatch' || inputs.validation != 'quick') && needs.quick.outputs.native == 'true'
    name: concurrency · first-party packages (ratchet)
    needs: quick
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Same cache as build/tests, read-only: this job never owns cache writes.
      - name: Restore Swift packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-v2-${{ runner.os }}-

      # continue-on-error on the STEP, not just the job: a package that is
      # mid-cleanup fails the build, and the job's value is the summary it
      # produces either way, not a red X on every PR.
      - name: Strict concurrency diagnostics
        continue-on-error: true
        run: |
          set -uo pipefail
          make strict-concurrency 2>&1 | tee "${RUNNER_TEMP}/strict-concurrency.log"
          status=${PIPESTATUS[0]}
          # Summarise rather than annotate every line: a package mid-cleanup can
          # emit hundreds of warnings, and the job summary is the artifact people
          # actually read.
          {
            echo "### Strict concurrency (report)"
            echo
            echo '```'
            grep -E "warning:|error:" "${RUNNER_TEMP}/strict-concurrency.log" \
              | sed -E 's#^.*/##' \
              | sort | uniq -c | sort -rn | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      # Its own step, without `continue-on-error`: a package that will not build stays tolerated
      # above, but first-party diagnostics growing is a regression this job is supposed to catch.
      # Vendored checkouts are outside the count — nobody here can fix them, and they used to be
      # the reason the report could only ever be a report.
      - name: Strict concurrency ratchet
        if: always()
        run: |
          set -euo pipefail
          python3 .github/scripts/strict_concurrency_ratchet.py \
            --log "${RUNNER_TEMP}/strict-concurrency.log" \
            --baseline Tools/Validation/repository-validation/strict-concurrency-baseline.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strict-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strict-concurrency.log
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  # One summary that refuses to blur the layers. Each job above keeps its own
  # gate; this job only collects the evidence and says what is still blocked.
  # ---------------------------------------------------------------------------
  report:
    name: report · consolidated QA evidence
    if: always()
    needs: [quick, build, tests, ui-tests, concurrency, device]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QUICK_RESULT: ${{ needs.quick.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      TESTS_RESULT: ${{ needs.tests.result }}
      UI_RESULT: ${{ needs.ui-tests.result }}
      CONCURRENCY_RESULT: ${{ needs.concurrency.result }}
      DEVICE_RESULT: ${{ needs.device.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download evidence artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/evidence
          pattern: |
            quality-report-*
            ui-tests-*
            coverage-*
            device-evidence-*

      - name: Combine evidence
        run: |
          python3 Tools/Audit/combined-report.py \
            --artifacts "${RUNNER_TEMP}/evidence" \
            --job "quick=${QUICK_RESULT}" \
            --job "build=${BUILD_RESULT}" \
            --job "tests=${TESTS_RESULT}" \
            --job "ui-tests=${UI_RESULT}" \
            --job "concurrency=${CONCURRENCY_RESULT}" \
            --job "device=${DEVICE_RESULT}" \
            --json "${RUNNER_TEMP}/combined-report.json" \
            --markdown "${RUNNER_TEMP}/combined-report.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish consolidated summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/combined-report.md" ]; then
            cat "${RUNNER_TEMP}/combined-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/combined-report.json
            ${{ runner.temp }}/combined-report.md
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Genuine iPhone acceptance. Never runs on a GitHub-hosted runner and never
  # starts for a pull request. The self-hosted runner must supply a development-
  # signed IPA and a UDID; the unsigned CI artifact cannot be installed here.
  # A simulator pass is not accepted as a substitute.
  # ---------------------------------------------------------------------------
  device:
    name: device · iPhone (self-hosted, opt-in)
    needs: [quick, build, tests, ui-tests]
    if: >-
      github.event_name != 'pull_request' &&
      vars.VEXSIGN_DEVICE_RUNNER == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.device == true) &&
      needs.quick.outputs.native == 'true'
    runs-on: [self-hosted, macos, arm64, ios-device]
    timeout-minutes: 90
    env:
      DEVICE_UDID: ${{ vars.VEXSIGN_DEVICE_UDID }}
      DEVICE_SIGNING_IDENTITY: ${{ secrets.VEXSIGN_DEVICE_SIGNING_IDENTITY }}
      DEVICE_IPA: ${{ vars.VEXSIGN_DEVICE_IPA }}
      RUN_DEVICE_TESTS: ${{ vars.VEXSIGN_DEVICE_RUN_TESTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require explicit device configuration
        run: |
          set -euo pipefail
          for key in DEVICE_UDID DEVICE_SIGNING_IDENTITY DEVICE_IPA; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured on the device runner"
              exit 1
            fi
          done
          test -f "$DEVICE_IPA" || { echo "::error::DEVICE_IPA does not exist on the runner"; exit 1; }
          echo "Device: $DEVICE_UDID"
          echo "IPA: $DEVICE_IPA"

      - name: Install, launch and test on device
        run: |
          set -euo pipefail
          flags=""
          if [ "$RUN_DEVICE_TESTS" = "true" ]; then flags="--run-tests"; fi
          python3 Tools/Audit/run-device-acceptance.py \
            --ipa "$DEVICE_IPA" \
            --device "$DEVICE_UDID" \
            --log "${RUNNER_TEMP}/device-acceptance.log" \
            --commit "${GITHUB_SHA}" $flags

      - name: Create per-feature device matrix
        run: |
          python3 Tools/Audit/feature-acceptance.py init \
            --ipa "$DEVICE_IPA" \
            --report "${RUNNER_TEMP}/feature-acceptance.json" \
            --commit "${GITHUB_SHA}"

      - name: Check per-feature device evidence
        id: feature_check
        continue-on-error: true
        run: |
          python3 Tools/Audit/feature-acceptance.py check \
            --ipa "$DEVICE_IPA" \
            --report "${RUNNER_TEMP}/feature-acceptance.json" \
            --commit "${GITHUB_SHA}"

      - name: Device summary
        if: always()
        run: |
          {
            echo "### Physical-device run"
            echo
            echo "Device: \`$DEVICE_UDID\`"
            echo "Feature evidence: ${{ steps.feature_check.outcome }}"
            echo
            echo "A simulator job never contributes to this section. Pending device cases remain blocked."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/device-acceptance.log
            ${{ runner.temp }}/feature-acceptance.json
            .artifacts/VexSignDevice.xcresult
          if-no-files-found: warn
          retention-days: 3
