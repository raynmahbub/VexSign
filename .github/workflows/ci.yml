name: CI

# The one workflow that answers "is this commit good?".
#
# No pull-request trigger: validate relevant changes once after they land on main,
# or explicitly validate a selected branch before merging with workflow_dispatch.
# Linux checks run first, then the unsigned build; simulator tests only start
# after the build and its warning gate pass. Manual quick mode avoids macOS.
#
#   quick   ~1 min · Linux + the official Swift container. Swift syntax,
#           duplicate types/file names, broken plists/xcstrings/pbxproj, and the
#           four repo gates in tools/ (localisation, error discipline, singleton
#           freeze, concurrency escapes).
#   build   macOS · unsigned Debug build of the VexSign scheme, then the warnings
#           gate: a new first-party warning fails, warnings listed in
#           .github/build-warnings-baseline.json are tolerated.
#   tests   macOS · `xcodebuild test` on a simulator resolved at run time.
#
# Deliberately not here:
#   * release builds          release.yml — tags and manual runs only
#   * companion SDKs          platform-check.yml — only when their sources change
#   * Python backend          server-tests.yml — only when server/ changes
#   * TypeScript cloud signer ecosystem.yml — only when its sources change
#   * SwiftLint               `make lint` locally; no bot commits on your branch
#
# Markdown- and docs-only changes do not start this workflow at all.
#
# Knobs (Settings → Secrets and variables → Actions → Variables):
#   BUILD_XCODE               Xcode version prefix ("26.3", "16.4"). Empty = the
#                             newest Xcode on the runner image. The code uses
#                             iOS 26 SDK API, so Xcode 16 cannot build it.
#   BUILD_WARNINGS_AS_ERRORS  "true" (default, baseline tolerated) · "strict"
#                             (every warning fails) · "false" (report only).
#   QUICK_CHECK_SWIFT_IMAGE   Swift container tag for the quick job.

on:
  push:
    branches: [main]
    paths:
      - 'VexSign/**'
      - 'VexSignTests/**'
      - 'VexSignWidgetExtension/**'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - 'NimbleKit/**'
      - 'AltSourceKit/**'
      - 'Zsign'
      - 'Zsign/**'
      - 'IDeviceKitten'
      - 'IDeviceKitten/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.gitmodules'
      - 'Makefile'
      - 'Scripts/**'
      - 'Tweaks/**'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/build-warnings-baseline.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      validation:
        description: 'quick: Linux checks only; full: checks, unsigned build and simulator tests'
        type: choice
        options: [full, quick]
        default: full
        required: true
      xcode:
        description: 'Xcode version prefix (e.g. "26.3", "16.4"). Empty = BUILD_XCODE variable or newest installed.'
        required: false
        default: ''
      warnings_as_errors:
        description: 'First-party warnings: true = fail on new ones (baseline tolerated), strict = fail on all, false = report only'
        type: choice
        options: ['true', 'strict', 'false']
        required: false
        default: 'true'

permissions:
  contents: read

# Newer runs for the same ref supersede stale work; other branches are independent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: everything that can be decided without Xcode.
  # ---------------------------------------------------------------------------
  quick:
    name: quick · syntax, resources, gates
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 and the Swift
    # container this job runs in (noble, below) is built for 24.04. Bump both
    # together when the image tag changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ vars.QUICK_CHECK_SWIFT_IMAGE || 'swift:6.4-noble' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swiftc --version
          python3 --version || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)

      - name: Quick check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          python3 .github/scripts/quick_check.py --root . --json "$RUNNER_TEMP/quick-check.json"

      # A literal without a catalogue key silently falls back to English, so the
      # drift only shows up in another language. Fails on missing keys;
      # `--write` adds them.
      - name: Localisation catalogue
        run: python3 tools/sync-strings.py --check

      # A silent `try?` at a user-visible boundary turns a real failure into
      # nothing in the log. Fails only when a file grows past its baseline;
      # justify a deliberate one with `// try? ok: <reason>` on the same line.
      - name: Error discipline
        run: python3 tools/error-discipline.py

      # Global `static let shared` singletons decide what a view model can be
      # tested with. The count may go down; a new one has to raise
      # tools/singleton-baseline.json in the same commit.
      - name: Singleton freeze
        run: python3 tools/singleton-freeze.py

      # `@unchecked Sendable`, `nonisolated(unsafe)` and `@preconcurrency` stop
      # the compiler from checking something. Freeze them; `make
      # strict-concurrency` is the real leaf build.
      - name: Concurrency discipline
        run: python3 tools/concurrency-discipline.py

      - name: Workflow trigger policy
        run: python3 tools/test_workflow_policy.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-check.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Does it compile?
  # ---------------------------------------------------------------------------
  build:
    name: build · VexSign Debug (unsigned)
    needs: quick
    if: github.event_name != 'workflow_dispatch' || inputs.validation != 'quick'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The `runner` context is not available in job-level env, so the scratch
      # paths are exported from a step instead.
      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSign.xcresult"
            echo "BUILD_LOG=${RUNNER_TEMP}/xcodebuild.log"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Swift package and binary targets (Vapor, Nuke, ZIPFoundation, …) are the
      # slow part of a cold build. The cache is keyed on the resolved graph and
      # shared with the `tests` job.
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | tail -n 20

      - name: Build (Debug)
        id: build
        run: |
          set -uo pipefail
          # Unsigned generic iOS build: no certificates exist on the runner and
          # none are needed to prove the code compiles. The local install
          # server's TLS identity lives in deps/ and is only needed by `make`,
          # not by a plain xcodebuild.
          xcodebuild \
            -workspace VexSign.xcworkspace \
            -scheme VexSign \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$BUILD_LOG" | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild exited with status ${status} - see the annotations and the summary."
          fi
          exit "${status}"

      # Annotates errors/warnings inline, writes the summary and enforces the
      # warnings gate. Runs even when the build step failed so the diagnostics
      # are always visible.
      - name: Report diagnostics
        id: report
        if: always() && steps.build.outcome != 'skipped'
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          # Dispatch input wins, then the repository variable, then the default.
          WARNINGS_AS_ERRORS: ${{ github.event_name == 'workflow_dispatch' && inputs.warnings_as_errors || (vars.BUILD_WARNINGS_AS_ERRORS || 'true') }}
        run: |
          python3 .github/scripts/xcodebuild_report.py \
            --log "$BUILD_LOG" \
            --build-exit "${BUILD_EXIT:-1}" \
            --warnings-as-errors "$WARNINGS_AS_ERRORS" \
            --baseline .github/build-warnings-baseline.json \
            --baseline-out "$RUNNER_TEMP/build-warnings-baseline.json" \
            --workspace "$GITHUB_WORKSPACE"

      # Warnings appeared or disappeared compared to the committed baseline:
      # offer the regenerated file so it can be committed as
      # .github/build-warnings-baseline.json (after fixing what is new).
      - name: Upload regenerated warnings baseline
        if: always() && steps.report.outputs.baseline_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: build-warnings-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-warnings-baseline.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload xcresult and log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSign.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Do the tests pass? Host-only suite, unsigned simulator run: no certificates
  # exist on the runner and none are needed to exercise signing *logic*.
  # ---------------------------------------------------------------------------
  tests:
    name: tests · VexSignTests (simulator)
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSignTests.xcresult"
            echo "TEST_LOG=${RUNNER_TEMP}/xcodebuild-test.log"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Same key shape as the build job, so whichever runs second reuses the
      # other's SwiftPM checkout.
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-${{ runner.os }}-

      # The destination is resolved at run time: runner images change the
      # installed simulator set with every Xcode update, and a hard-coded name
      # is the usual reason a test job starts failing on a day nothing changed.
      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          line="$(python3 .github/scripts/select_simulator.py)"
          udid="${line##* }"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${line}"

      - name: Run tests
        id: test
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -uo pipefail
          xcodebuild \
            -workspace VexSign.xcworkspace \
            -scheme VexSignTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:VexSignTests \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test 2>&1 | tee "$TEST_LOG" | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild test exited with status ${status} - see the annotations, the summary and the uploaded xcresult."
          fi
          exit "${status}"

      # Neither the reporter nor the raw log can say *which* test failed: newer
      # Xcode writes per-test results into the xcresult bundle, not into
      # xcodebuild's stdout (a 26,000-line log with one `** TEST FAILED **` in
      # it and nothing else). Unfiled annotations also do not survive onto the
      # check run, so every failing test is re-emitted as a filed annotation —
      # which the pull request page and the API can both read.
      - name: Surface failures
        if: failure()
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/VexSignTests.xcresult
          TEST_LOG: ${{ runner.temp }}/xcodebuild-test.log
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
          SUMMARY_JSON: ${{ runner.temp }}/summary.json
        run: |
          # GitHub keeps at most 10 annotations per step, so the interesting
          # facts are packed into a handful of lines instead of one annotation
          # per field: a crash stack is one annotation, not thirty.
          set +e
          annotate() {
            python3 -c 'import sys; t=sys.argv[1]; print("::error file=.github/workflows/ci.yml,line=1::" + "".join(c for c in t if c not in "\r\n")[:900])' "$1"
          }

          annotate "xcodebuild test exit=${TEST_EXIT:-unknown}; xcresult=$([ -d "$RESULT_BUNDLE" ] && echo present || echo absent); log=$([ -f "$TEST_LOG" ] && wc -l < "$TEST_LOG" | tr -d ' ' || echo absent) lines"

          CRASH_STACK=""

          if [ -d "$RESULT_BUNDLE" ]; then
            echo "::group::failing tests"
            xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --format json > "$RUNNER_TEMP/summary.json" 2>/dev/null
            xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" --format json > "$RUNNER_TEMP/tests.json" 2>/dev/null

            xcrun xcresulttool export diagnostics \
              --path "$RESULT_BUNDLE" \
              --output-path "$RUNNER_TEMP/xcresult-diagnostics" >/dev/null 2>&1

            CRASH_STACK=$(python3 - "$RUNNER_TEMP/tests.json" "$RUNNER_TEMP/xcresult-diagnostics" <<'PYEOF'
          import json, os, sys

          tests_path, diag_dir = sys.argv[1], sys.argv[2]

          def failures():
              try:
                  with open(tests_path) as handle:
                      data = json.load(handle)
              except Exception:
                  return []
              seen, found = set(), []

              def walk(node):
                  if isinstance(node, dict):
                      if node.get("result") == "failed":
                          name = node.get("name") or node.get("nodeIdentifier") or "?"
                          if name.startswith("All tests") or name == "VexSignTests":
                              pass
                          else:
                              msg = []
                              for detail in node.get("failureMessages") or []:
                                  if isinstance(detail, dict) and detail.get("failureMessage"):
                                      msg.append(detail["failureMessage"])
                              key = (name, tuple(msg))
                              if key not in seen:
                                  seen.add(key)
                                  found.append((name, msg))
                      for value in node.values():
                          walk(value)
                  elif isinstance(node, list):
                      for value in node:
                          walk(value)

              walk(data)
              return found

          def ips_files(root):
              for base, _dirs, names in os.walk(root):
                  for name in names:
                      if name.endswith(".ips") or name.endswith(".crash"):
                          yield os.path.join(base, name)

          stack = ""
          for path in ips_files(diag_dir):
              try:
                  with open(path, encoding="utf-8", errors="replace") as handle:
                      text = handle.read()
                  payload = json.loads(text.splitlines()[-1])
              except Exception:
                  continue
              threads = payload.get("threads") or []
              index = payload.get("faultingThread")
              if not isinstance(index, int) or index >= len(threads):
                  index = next((i for i, t in enumerate(threads) if t.get("triggered")), 0)
              frames = (threads[index].get("frames") or []) if threads else []
              names = [f.get("symbol") or f.get("imageOffset") or "?" for f in frames]
              if names:
                  stack = " <- ".join(str(n)[:70] for n in names[:24])
                  break

          if stack:
              print("STACK " + stack)

          summary_path = os.path.join(diag_dir, "..", "summary.json")
          summary = {}
          try:
              with open(os.environ.get("SUMMARY_JSON", "")) as handle:
                  summary = json.load(handle)
              bits = [f"result={summary.get('result', '?')}"]
              for key in ("totalTestCount", "passedTests", "failedTests", "skippedTests", "expectedFailures"):
                  if summary.get(key) is not None:
                      bits.append(f"{key}={summary[key]}")
              print("SUMMARY " + " ".join(str(b) for b in bits))

              # Every failing test by name, not just the first three: the log is
              # the only place these survive in full, and a message without the
              # test that produced it costs a second run to find.
              named = summary.get("testFailures") or []
              print(f"failing tests: {len(named)}")
              for failure in named:
                  title = str(failure.get("testName") or "?")[:200]
                  context = failure.get("sourceCodeContext") or {}
                  location = context.get("location") or {}
                  where = ""
                  if location.get("filePath"):
                      where = " @ %s:%s" % (location.get("filePath"), location.get("lineNumber", "?"))
                  detail = str(failure.get("failureText") or "").replace("\n", " ")[:300]
                  print("FAILED " + title + where + (" — " + detail if detail else ""))
              for failure in named[:2]:
                  # The assertion that failed, with its line, is in here; print it
                  # for the first couple so a run needs no second run to explain it.
                  print("RAW " + json.dumps(failure)[:700])
              # Annotations are capped by GitHub at ten per step, so only the
              # first few are re-emitted as ones a reader can click through.
              for failure in named[:5]:
                  title = str(failure.get("testName") or "?")[:200]
                  detail = str(failure.get("failureText") or "").replace("\n", " ")[:300]
                  print("TEST " + title + (" — " + detail if detail else ""))
          except Exception as error:
              print("SUMMARY unavailable: " + str(error)[:160])

          # Anything `test-results tests` knows about but the summary did not
          # name. Without it a crash can report zero failing tests.
          seen = {str(item.get("testName") or "") for item in (summary.get("testFailures") or [])}
          for name, messages in failures():
              if name in seen:
                  continue
              print("FAILED " + name[:200] + (" — " + messages[0][:300] if messages else ""))
          PYEOF
            )
            echo "::endgroup::"
          fi

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              STACK*) annotate "crash stack (callee <- caller): ${line#STACK }" ;;
              TEST*) annotate "${line#TEST }" ;;
              SUMMARY*) annotate "${line#SUMMARY }" ;;
              # Kept out of the annotations: GitHub caps those at ten per step, and
              # the log is where the complete list has to live.
              FAILED*|RAW*) echo "${line}" ;;
            esac
          done <<< "$CRASH_STACK"

          if [ -f "$TEST_LOG" ]; then
            # A trap in the host app prints to stderr, a little above the
            # `** TEST FAILED **` marker; that context is worth more than the
            # tail of an xcodebuild log that is mostly build chatter.
            python3 - "$TEST_LOG" > "$RUNNER_TEMP/context.txt" <<'PYEOF'
          import re, sys

          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          marker = next((i for i, l in enumerate(lines) if "** TEST FAILED **" in l), None)
          picked = []
          if marker is not None:
              before = [l.strip() for l in lines[max(0, marker - 40):marker] if l.strip()][-3:]
              after = [l.strip() for l in lines[marker + 1:marker + 30] if l.strip()][:4]
              picked = before + after
          offender = re.compile(r"ran off the main queue|CoreData: error|NSInternalInconsistencyException")
          flagged = [l.strip() for l in lines if offender.search(l)][-4:]
          picked = flagged + picked
          if not picked:
              pick = re.compile(r"error:|BUILD FAILED|Fatal error|Precondition failed|SIGABRT")
              picked = [l.strip() for l in lines if pick.search(l)][-6:]
          picked = picked[-8:]
          for line in picked:
              print(line[:400])
          PYEOF
            while IFS= read -r line; do
              [ -n "$line" ] && annotate "log: $line"
            done < "$RUNNER_TEMP/context.txt"
          fi

          exit 0
      - name: Report diagnostics
        if: always() && steps.test.outcome != 'skipped'
        env:
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
          SUMMARY_JSON: ${{ runner.temp }}/summary.json
        run: |
          if [ ! -f "$TEST_LOG" ]; then
            echo "::warning::No xcodebuild log was produced."
            exit 0
          fi
          python3 .github/scripts/xcodebuild_report.py \
            --log "$TEST_LOG" \
            --build-exit "${TEST_EXIT:-1}" \
            --warnings-as-errors false \
            --title "Tests" \
            --workspace "$GITHUB_WORKSPACE"

      # A failure is usually a destination or embedding problem, not an
      # assertion. Print what this runner actually offers.
      - name: Show available destinations
        if: failure()
        run: xcodebuild -workspace VexSign.xcworkspace -scheme VexSignTests -showdestinations || true

      - name: Upload xcresult and log
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSignTests.xcresult
            ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14
