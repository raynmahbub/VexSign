name: Repair diagnostics

# Free-only mode: diagnostics/issues, never hosted model inference.
on:
  workflow_run:
    workflows: [CI, Platform check]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Failed supported current-main workflow run ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bounded-repair-agent
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  diagnose:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' && (github.run_attempt == '1' && vars.FREE_DIAGNOSTICS_ENABLED != 'false' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record a deduplicated failure for human investigation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/repair-agent.py admit --run-id "$SOURCE_RUN"
