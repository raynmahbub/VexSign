name: Repair agent

# Default-branch code only. No issue_comment or pull_request_target execution.
on:
  workflow_run:
    workflows: [CI, Platform check]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Failed supported main workflow run ID (one attempt per source commit)'
        required: true
        type: string

permissions:
  contents: read

# Admission and budget reservation are serialized across all failures/retries.
concurrency:
  group: bounded-repair-agent
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  admit:
    if: >-
      github.run_attempt == '1' &&
      vars.REPAIR_AGENT_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      admitted: ${{ steps.reserve.outputs.admitted }}
      source_sha: ${{ steps.reserve.outputs.source_sha }}
      issue: ${{ steps.reserve.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reserve one attempt within the daily budget
        id: reserve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/repair-agent.py admit --run-id "$SOURCE_RUN"

  propose:
    needs: admit
    if: needs.admit.outputs.admitted == 'true' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      models: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Request a structured repair, without tools or shell execution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_MODEL: ${{ vars.REPAIR_MODEL }}
        run: python3 tools/repair-agent.py propose --run-id "$SOURCE_RUN" --output "$RUNNER_TEMP/repair-proposal"
      - name: Transfer proposal data only
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repair-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-proposal/proposal.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [admit, propose]
    if: success() && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.propose.outputs.artifact_id }}
          path: ${{ runner.temp }}/repair-proposal
      # Revalidate with trusted default-branch policy. No proposed code is run.
      - name: Recheck scope and source, then open a human-reviewed PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.admit.outputs.issue }}
        run: >-
          python3 tools/repair-agent.py publish --run-id "$SOURCE_RUN"
          --issue "$ISSUE_NUMBER" --proposal "$RUNNER_TEMP/repair-proposal/proposal.json"

  report:
    needs: [admit, propose, publish]
    if: always() && needs.admit.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Record outcome in the reserved escalation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.admit.outputs.issue }}
          PROPOSE_RESULT: ${{ needs.propose.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body \
            "Repair attempt finished: proposal=$PROPOSE_RESULT, publish=$PUBLISH_RESULT. Workflow: $RUN_URL. No automatic retry. If no PR was published, human investigation is required."
