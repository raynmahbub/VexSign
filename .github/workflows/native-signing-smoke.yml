name: Native account signing · link smoke

# Opt-in only. No Apple login, provisioning, certificate creation, signing keys,
# IPA publication or changes to the normal app's package graph.
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Installed Xcode version prefix (26.2 or newer)'
        required: true
        default: '26.2'
      combined_dependencies:
        description: 'Also prepare/resolve/verify the combined app-package and SDK candidate (no combined build)'
        type: boolean
        default: false
      server_compatibility:
        description: 'Also resolve/build/test the separate macOS Vapor/Crypto candidate (no listeners)'
        type: boolean
        default: false
      simulator:
        description: 'Also compile/link for an arm64 iOS Simulator (does not run tests)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-signing-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Repository and preparation regressions
        run: make verify

  link:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select installed Xcode
        env:
          REQUESTED_XCODE: ${{ inputs.xcode }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(/Applications/Xcode_"${REQUESTED_XCODE}"*.app)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::Requested Xcode is not installed."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "${candidates[0]}/Contents/Developer"
          xcodebuild -version
      - name: Optionally validate the separate Vapor and Crypto candidate
        if: inputs.server_compatibility
        run: |
          set -euo pipefail
          python3 NativeSigning/prepare_server_compatibility.py
          swift package --package-path .build/server-dependency-compatibility resolve
          python3 NativeSigning/prepare_server_compatibility.py --verify-resolved
          swift test --package-path .build/server-dependency-compatibility --force-resolved-versions \
            2>&1 | tee "$RUNNER_TEMP/server-dependency-compatibility.log"
      - name: Optionally resolve the combined app-package and SDK candidate
        if: inputs.combined_dependencies
        run: |
          set -euo pipefail
          python3 NativeSigning/prepare_combined_smoke.py
          swift package --package-path .build/combined-signing-smoke resolve \
            2>&1 | tee "$RUNNER_TEMP/combined-signing-resolution.log"
          python3 NativeSigning/prepare_combined_smoke.py \
            --verify-resolved .build/combined-signing-smoke/Package.resolved
      - name: Prepare pinned isolated package graph
        run: |
          set -euo pipefail
          python3 NativeSigning/prepare_smoke.py 2>&1 | tee "$RUNNER_TEMP/native-signing-prepare.log"
      - name: Compile and dynamically link device dependencies
        working-directory: .build/native-signing-smoke
        run: |
          set -euo pipefail
          xcodebuild -scheme NativeSigningLinkSmoke -destination 'generic/platform=iOS' \
            -sdk iphoneos -derivedDataPath ../native-signing-device \
            -configuration Release ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/native-signing-device.log"
      - name: Optionally compile and link simulator dependencies
        if: inputs.simulator
        working-directory: .build/native-signing-smoke
        run: |
          set -euo pipefail
          xcodebuild -scheme NativeSigningLinkSmoke -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator -derivedDataPath ../native-signing-simulator \
            -configuration Release ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/native-signing-simulator.log"
      - name: Upload diagnostic logs and provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-signing-link-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-signing-prepare.log
            ${{ runner.temp }}/native-signing-device.log
            ${{ runner.temp }}/native-signing-simulator.log
            .build/native-signing-smoke/provenance.json
            ${{ runner.temp }}/server-dependency-compatibility.log
            .build/server-dependency-compatibility/provenance.json
            .build/server-dependency-compatibility/resolution-attestation.json
            ${{ runner.temp }}/combined-signing-resolution.log
            .build/combined-signing-smoke/combined-provenance.json
            .build/combined-signing-smoke/combined-resolution-attestation.json
