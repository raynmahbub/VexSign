name: Unit tests

# Runs the existing VexSignTests suite. Until this workflow existed, 78 unit
# tests were committed but never executed: build-check compiles the app, the
# platform check compiles the companions, and nothing ran `xcodebuild test`.
# See docs/ROADMAP.md (VX-10) and docs/AUDIT_2026-10-31.md (AX-10).
#
# Why a simulator and not a device: the suite is host-only by design (pure
# helpers, UserDefaults keys with unique names, file-scoped fixtures), so an
# unsigned simulator run is both sufficient and reproducible.
#
# The destination is resolved at run time by .github/scripts/select_simulator.py
# instead of being pinned to "iPhone 16": runner images change the installed
# simulator set with every Xcode update, and a hard-coded name is the usual
# reason a test job starts failing on a day nothing changed.
#
# Parallel testing is disabled on purpose. The scheme marks the testable as
# parallelizable, but several tests touch process-wide state (UserDefaults,
# the shared Storage singleton, SourceURLPolicy's opt-in flag); running them
# concurrently would trade a fast job for an intermittent one.
#
# Knobs (Settings → Secrets and variables → Actions → Variables):
#   TEST_XCODE  Xcode version prefix (same meaning as BUILD_XCODE). Empty =
#               newest Xcode on the runner, which is required because the app
#               uses iOS 26 SDK API.

on:
  push:
    branches: [main]
    paths:
      - '**.swift'
      - '**.plist'
      - '**.entitlements'
      - '**.xcstrings'
      - 'VexSign.xcodeproj/**'
      - 'VexSign.xcworkspace/**'
      - '.github/scripts/select_simulator.py'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: xcodebuild test · VexSignTests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The `runner` context is not available in job-level env, so the scratch
      # paths are exported from a step instead.
      - name: Paths
        run: |
          {
            echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData"
            echo "RESULT_BUNDLE=${RUNNER_TEMP}/VexSignTests.xcresult"
            echo "TEST_LOG=${RUNNER_TEMP}/xcodebuild-test.log"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        id: xcode
        env:
          REQUESTED_XCODE: ${{ vars.TEST_XCODE || vars.BUILD_XCODE || '' }}
        run: bash .github/scripts/select_xcode.sh

      # Same cache key shape as build-check so a PR that runs both jobs warms
      # one SwiftPM checkout for the other.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.xcode_version }}-
            spm-${{ runner.os }}-

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          # One call: the script prints "iPhone 17 (26.0) <UDID>", so the UDID
          # is the last token. Resolving twice could (theoretically) pick twice.
          line="$(python3 .github/scripts/select_simulator.py)"
          udid="${line##* }"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${line}"

      # Unsigned simulator run: no certificates exist on the runner and none
      # are needed - the tests exercise signing *logic*, not a signing identity.
      - name: Run tests
        id: test
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -uo pipefail
          xcodebuild \
            -workspace VexSign.xcworkspace \
            -scheme VexSignTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:VexSignTests \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test 2>&1 | tee "$TEST_LOG" | { if command -v xcbeautify >/dev/null; then xcbeautify --quiet --renderer terminal --disable-logging; else cat; fi; }
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "::error::xcodebuild test exited with status ${status} - see the annotations, the summary and the uploaded xcresult."
          fi
          exit "${status}"

      # Reuses the build-check reporter so test failures are annotated inline
      # (file + line) and summarised the same way compiler errors are. The
      # warnings gate is off here: build-check owns that verdict, and this job
      # only needs to answer "did the tests pass".
      - name: Report diagnostics
        if: always() && steps.test.outcome != 'skipped'
        env:
          TEST_EXIT: ${{ steps.test.outputs.exit_code }}
        run: |
          if [ ! -f "$TEST_LOG" ]; then
            echo "::warning::No xcodebuild log was produced."
            exit 0
          fi
          python3 .github/scripts/xcodebuild_report.py \
            --log "$TEST_LOG" \
            --build-exit "${TEST_EXIT:-1}" \
            --warnings-as-errors false \
            --title "Unit tests" \
            --workspace "$GITHUB_WORKSPACE"

      # A failure is usually a destination/embedding problem, not a test
      # assertion. Print what this runner actually offers so the fix does not
      # start with guessing.
      - name: Show available destinations
        if: failure()
        run: xcodebuild -workspace VexSign.xcworkspace -scheme VexSignTests -showdestinations || true

      - name: Upload xcresult and log
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/VexSignTests.xcresult
            ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14
