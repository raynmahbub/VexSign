name: Documentation

# Cheap offline validation for documentation-only changes, without macOS jobs.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'Documentation/**'
      - 'Tools/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'Documentation/**'
      - 'Tools/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded push to a pull request should stop: the newest commit is the one under
# review. A push to main is the opposite — those commits are already merged, and cancelling the
# run destroys the only validation that commit will ever get. On main the group is therefore
# keyed by SHA, so consecutive merges queue independently instead of replacing each other.
# (Before this, runs 370-386 on main were all cancelled and main had no completed CI.)
concurrency:
  group: docs-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        run: make docs-check
