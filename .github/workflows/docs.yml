name: Documentation

# Cheap offline validation for documentation-only changes, without macOS jobs.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'tools/check-docs.py'
      - 'tools/test_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'tools/check-docs.py'
      - 'tools/test_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        run: make docs-check
