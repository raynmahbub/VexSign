name: Documentation

# Cheap offline validation for documentation-only changes, without macOS jobs.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'tools/check-docs.py'
      - 'tools/test_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'tools/check-docs.py'
      - 'tools/test_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check documentation
        run: make docs-check
