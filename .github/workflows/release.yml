name: Release

# Run manually to publish v<MARKETING_VERSION> from the selected commit, push a
# release tag, or let the nightly schedule publish a pre-release from main.
# Check build_only for an unpublished test IPA instead. Stable releases require
# a commit on the default branch; nightly releases are unique, dated tags so a
# bad nightly is never retried over a good one. Device TLS is created on device.
# Build with a read-only token; publish artifacts in a separate protected job.
# Configure the release environment before use. See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: >-
          Test only: check this to build an IPA WITHOUT publishing. Unchecked
          (default) publishes a release for the selected branch version.
        required: false
        type: boolean
        default: false
      xcode:
        description: >-
          Xcode version to build with (e.g. "26.3", "16.4"). Leave empty to use
          the RELEASE_XCODE repository variable, or failing that the newest
          Xcode installed on the runner image.
        required: false
        default: ''
      channel:
        description: >-
          Publish channel. "stable" cuts v<MARKETING_VERSION>; "nightly" cuts a
          unique v<MARKETING_VERSION>-nightly.<date>.<run> pre-release. The
          scheduled run always uses nightly.
        required: false
        type: choice
        options: [stable, nightly]
        default: stable
      prerelease:
        description: "Manual stable publish only: mark the release as a pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Manual publish only: create the release as a draft"
        required: false
        type: boolean
        default: false
  # Push a release tag to publish automatically. The tag must be
  # v<MARKETING_VERSION>, optionally followed by a -pre-release suffix:
  # v1.2, v1.2.0, v1.2.0-beta.1, v1.2-rc1.
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Automated nightly pre-release from the default branch. The tag is unique
  # (date + run number + attempt), so publishing never overwrites an earlier
  # nightly and a failed build can be retried safely.
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC
  # No pull_request trigger. CI validates relevant PRs, main pushes or manual branch
  # requests; stable Release remains tag/manual-only, nightly is scheduled.

permissions:
  contents: read

# Publishing runs (tag pushes and manual publishes) share one group, so two
# releases can never race each other and a publish in flight is never
# cancelled. Build-only runs are grouped per ref instead, so they don't queue
# behind a release.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'release-nightly' || ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.build_only)) && 'release-publish' || format('release-{0}', github.ref)) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    environment: ${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'build-preview' || (github.event_name == 'workflow_dispatch' && inputs.build_only && 'build-preview' || 'release') }}
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      prerelease: ${{ steps.mode.outputs.prerelease }}
      channel: ${{ steps.mode.outputs.channel }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Full history is required for agvtool and for changelog generation
          # (we diff against the previous release tag).
          fetch-depth: 0

      # Decide up front whether this run publishes and, if so, under which tag.
      # Everything that can be validated without building (tag shape, tag vs.
      # MARKETING_VERSION, tag already taken) fails here, before we spend ten
      # minutes of macOS runner time.
      - name: Resolve release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_ONLY: ${{ inputs.build_only }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          RELEASE_TAG_RE='^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'

          # MARKETING_VERSION as committed in the project. Empty when the
          # targets disagree - then only the authoritative post-build check
          # (against the built Info.plist) applies.
          PROJECT_VERSION="$(grep -oE 'MARKETING_VERSION = [^;]+;' VexSign.xcodeproj/project.pbxproj \
            | sed -E 's/^MARKETING_VERSION = "?([^";]*)"?;$/\1/' | sort -u)"
          if [ "$(printf '%s\n' "${PROJECT_VERSION}" | grep -c .)" -ne 1 ]; then
            echo "::warning::Targets disagree on MARKETING_VERSION ($(printf '%s' "${PROJECT_VERSION}" | tr '\n' ' ')); the version check will run after the build only."
            PROJECT_VERSION=""
          fi

          MODE="build-only"
          case "${EVENT_NAME}" in
            push)          MODE="tag" ;;
            pull_request)  MODE="pull-request" ;;
            schedule)      MODE="nightly" ;;
            workflow_dispatch)
              if [ "${BUILD_ONLY}" = "false" ]; then
                # A tag dispatch retries unpublished source; existing releases
                # cannot be overwritten. Branch mode cuts v<MARKETING_VERSION>.
                # An explicit nightly dispatch always uses a dated pre-release.
                if [ "${INPUT_CHANNEL}" = "nightly" ]; then
                  MODE="nightly"
                elif [ "${REF_TYPE}" = "tag" ]; then
                  MODE="tag"
                else
                  MODE="manual"
                fi
              fi ;;
          esac

          PUBLISH=false
          RELEASE_TAG=""
          case "${MODE}" in
            tag)
              RELEASE_TAG="${REF_NAME}"
              if ! printf '%s' "${RELEASE_TAG}" | grep -qE "${RELEASE_TAG_RE}"; then
                echo "::error::'${RELEASE_TAG}' is not a release tag. Release tags are v<MARKETING_VERSION>, e.g. v1.2.0 or v1.2.0-beta.1."
                exit 1
              fi
              PUBLISH=true
              ;;
            manual)
              if [ -z "${PROJECT_VERSION}" ]; then
                echo "::error::Cannot derive a release tag because the targets disagree on MARKETING_VERSION. Fix the project or push a tag instead."
                exit 1
              fi
              RELEASE_TAG="v${PROJECT_VERSION}"
              if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
                echo "::error::${RELEASE_TAG} already exists on origin; refusing to overwrite a published release with a branch build. Bump MARKETING_VERSION for a new release, or re-run the workflow run that belongs to the ${RELEASE_TAG} tag."
                exit 1
              fi
              PUBLISH=true
              ;;
            nightly)
              if [ -z "${PROJECT_VERSION}" ]; then
                echo "::error::Cannot derive a nightly tag because the targets disagree on MARKETING_VERSION. Fix the project first."
                exit 1
              fi
              # Unique per date, run and attempt. Never move or reuse a nightly
              # tag: an install can be pinned to the exact build it downloaded.
              NIGHTLY_DATE="$(date -u +%Y%m%d)"
              RELEASE_TAG="v${PROJECT_VERSION}-nightly.${NIGHTLY_DATE}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
              PUBLISH=true
              ;;
          esac

          if [ "${PUBLISH}" = "true" ]; then
            if [ "${REF_TYPE}" = "branch" ] && [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "::error::Publish from the default branch only. Other branches can use build_only."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
              echo "::error::Release commit must be part of the default branch history."
              exit 1
            fi
          fi

          EXPECTED_VERSION=""
          PRERELEASE=false
          if [ -n "${RELEASE_TAG}" ]; then
            EXPECTED_VERSION="${RELEASE_TAG#v}"
            EXPECTED_VERSION="${EXPECTED_VERSION%%-*}"
            case "${RELEASE_TAG}" in *-*) PRERELEASE=true ;; esac
            if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PRERELEASE}" = "true" ]; then
              PRERELEASE=true
            fi

            if [ -n "${PROJECT_VERSION}" ] && [ "${PROJECT_VERSION}" != "${EXPECTED_VERSION}" ]; then
              echo "::error::${RELEASE_TAG} does not match the project's MARKETING_VERSION (${PROJECT_VERSION}). A release tag must be v<MARKETING_VERSION>, optionally followed by -<pre-release>. Bump the version (Xcode > VexSign target > General > Version, or: agvtool new-marketing-version ${EXPECTED_VERSION}), commit, and create a new matching tag. Never move a published tag"
              exit 1
            fi
          fi

          CHANNEL="preview"
          if [ "${MODE}" = "nightly" ]; then
            CHANNEL="nightly"
          elif [ "${PUBLISH}" = "true" ]; then
            if [ "${PRERELEASE}" = "true" ]; then CHANNEL="prerelease"; else CHANNEL="stable"; fi
          fi

          case "${MODE}" in
            tag)          echo "Mode: publish release ${RELEASE_TAG} from tag (commit ${GITHUB_SHA})" ;;
            manual)       echo "Mode: MANUAL publish of ${RELEASE_TAG} from ${REF_NAME} (commit ${GITHUB_SHA}) - prefer pushing a tag for real releases" ;;
            nightly)      echo "Mode: NIGHTLY pre-release ${RELEASE_TAG} from ${REF_NAME} (commit ${GITHUB_SHA})" ;;
            pull-request) echo "Mode: pull request build - nothing will be published" ;;
            *)            echo "Mode: build only (${REF_NAME}) - nothing will be published" ;;
          esac

          {
            echo "mode=${MODE}"
            echo "publish=${PUBLISH}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_version=${RELEASE_TAG#v}"
            echo "expected_version=${EXPECTED_VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "channel=${CHANNEL}"
          } >> "$GITHUB_OUTPUT"

      - name: Repository validation gates
        run: make verify

      # Checkouts are shared by all release runs for the same resolved graph.
      # Build products stay in the runner-local DerivedData.
      - name: Restore Swift packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/VexSign/SourcePackages
          key: spm-release-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-

      - name: Select Xcode
        env:
          # Manual input wins; otherwise the RELEASE_XCODE repository variable
          # (set it to pin tag releases to a known toolchain); otherwise the
          # newest Xcode on the runner image.
          REQUESTED_XCODE: ${{ inputs.xcode || vars.RELEASE_XCODE || '' }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          if [ -n "${REQUESTED_XCODE}" ]; then
            candidates=(/Applications/Xcode_"${REQUESTED_XCODE}"*.app)
          else
            candidates=(/Applications/Xcode_*.app)
          fi

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::No Xcode matching '${REQUESTED_XCODE:-*}' is installed on this runner."
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          if [ -n "${REQUESTED_XCODE}" ]; then
            XCODE_APP="${candidates[0]}"
          else
            XCODE_APP="$(printf '%s\n' "${candidates[@]}" | sort | tail -n 1)"
          fi

          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Compile VexSign
        id: build
        env:
          # Keep DerivedData (and its SourcePackages) under the cached path.
          TMPDIR: ${{ runner.temp }}/
        run: |
          set -euo pipefail

          BUILD_NUMBER="$(git rev-parse HEAD)"
          if ! agvtool new-version -all "${BUILD_NUMBER}"; then
            echo "::warning::agvtool could not stamp the build number (${BUILD_NUMBER}); continuing with the committed CURRENT_PROJECT_VERSION."
          fi

          # Keep the known third-party Unicorn deployment-version warning out
          # of the live log; the full log stays in the failure artifact.
          make 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" \
            | { grep -v -F 'libunicorn.a' || true; }

          if ! ls packages/*.ipa >/dev/null 2>&1; then
            echo "::error::make finished but produced no .ipa in packages/."
            exit 1
          fi

          mkdir -p upload
          mv packages/*.ipa upload/

      # Validate the exact packaged commit for every channel, including previews.
      - name: Release simulator tests
        run: make test

      - name: Surface build errors
        if: failure() && steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if [ -f "$LOG" ]; then
            grep -nE "error:" "$LOG" | sed -E 's/^([0-9]+):[[:space:]]*([^:]+):([0-9]+):([0-9]+):[^:]*:[[:space:]]*(.*)$/::error file=\2,line=\3,col=\4::\5/' | head -150
            grep -E "error:" "$LOG" | grep -vE ":[0-9]+:[0-9]+:[[:space:]]*error:" | sed -E 's/^[[:space:]]*(.*)$/::error::\1/' | head -30
          fi

          exit 0

      # Authoritative version check: what the packaged app actually reports
      # must be what the release tag promises.
      - name: Verify built version
        id: get_version
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.release_tag }}
          EXPECTED_VERSION: ${{ steps.mode.outputs.expected_version }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          plists=(Payload/*.app/Info.plist)
          if [ "${#plists[@]}" -eq 0 ]; then
            echo "::error::No built app bundle found under Payload/ - did the build succeed?"
            exit 1
          fi

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${plists[0]}")"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read CFBundleShortVersionString from ${plists[0]}."
            exit 1
          fi
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "${plists[0]}" 2>/dev/null || true)"

          if [ -n "${EXPECTED_VERSION}" ] && [ "${VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::The built app reports CFBundleShortVersionString ${VERSION}, but ${RELEASE_TAG} promises ${EXPECTED_VERSION}. Bump MARKETING_VERSION to ${EXPECTED_VERSION}, commit, and move the tag onto that commit."
            exit 1
          fi

          echo "Built VexSign ${VERSION} (build ${BUILD:-?}) from ${GITHUB_SHA}"
          {
            echo "version=${VERSION}"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Every successful build-only or release run leaves a
      # downloadable IPA on the run page. This is how you test a change
      # without publishing it.
      - name: Upload IPA artifact
        id: artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: VexSign-${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.short_sha }}
          path: upload/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Generate Changelog
        id: changelog
        if: steps.mode.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.mode.outputs.release_version }}
        run: |
          set -euo pipefail
          bash tools/generate-changelog.sh > "$RUNNER_TEMP/CHANGELOG.md"
          cp "$RUNNER_TEMP/CHANGELOG.md" upload/CHANGELOG.md
          (cd upload && shasum -a 256 ./*.ipa > SHA256SUMS)

      - name: Package verified release assets
        id: bundle
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upload/*.ipa
            upload/SHA256SUMS
            upload/CHANGELOG.md
          if-no-files-found: error
          retention-days: 14


  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.build.outputs.channel == 'nightly' && 'nightly' || 'release' }}
    permissions:
      contents: write
    steps:
      # No checkout or execution of repository build scripts with a write token.
      - name: Download this run's verified release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: upload

      - name: Verify asset checksums
        working-directory: upload
        run: sha256sum --check SHA256SUMS

      - name: Refuse overwriting an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          # Listing must succeed: auth/network errors cannot be treated as absence.
          gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/released-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/released-tags"; then
            echo "::error::Release already exists; publish a new version rather than overwriting assets."
            exit 1
          fi
          # A tag created/moved during the build must not label different source.
          gh api --paginate "repos/${GH_REPO}/tags" --jq '.[] | [.name, .commit.sha] | @tsv' > "$RUNNER_TEMP/tag-targets"
          tagged_sha="$(awk -F '\t' -v tag="$RELEASE_TAG" '$1 == tag {print $2}' "$RUNNER_TEMP/tag-targets")"
          if [ -n "$tagged_sha" ] && [ "$tagged_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag no longer points to the built commit. Refusing publication."
            exit 1
          fi

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          name: VexSign ${{ needs.build.outputs.release_tag }}
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: upload/CHANGELOG.md
          files: |
            upload/*.ipa
            upload/SHA256SUMS
          fail_on_unmatched_files: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: echo "Published verified release assets at ${RELEASE_URL}" >> "$GITHUB_STEP_SUMMARY"

  sync-repository:
    needs: [build, publish]
    if: needs.build.outputs.channel == 'stable' && (github.event_name != 'workflow_dispatch' || !inputs.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # GITHUB_TOKEN-created releases do not emit downstream workflow events.
      # Dispatch the existing updater explicitly; no repository code runs here.
      - name: Queue repository listing update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run update_repo.yml --repo "$GH_REPO" --ref "$DEFAULT_BRANCH" -f "tag=$RELEASE_TAG"
          echo 'Repository listing update queued. Check Update Repository for completion; a dispatch is not a completed sync.' >> "$GITHUB_STEP_SUMMARY"
