name: Create Blank Issue
description: Blank issue report for VexSign. Use this for anything other than a bug or feature request.

body:
  - type: markdown
    attributes:
      value: >-
        Before opening an issue, make sure there isn't already the same bug
        reported, and keep the report civil and on topic.

  - type: textarea
    id: text
    attributes:
      label: Content
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Request Agreement
      options:
        - label: I have read the requirements for opening an issue above
          required: true
