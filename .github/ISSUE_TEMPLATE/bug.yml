name: Bug report
description: Report a reproducible bug or crash in VexSign.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Before opening an issue, search for an existing report and read the
        [Code of Conduct](https://github.com/raynmahbub/VexSign/blob/main/CODE_OF_CONDUCT.md).
        **Never include certificates, private keys, passwords, Apple ID details,
        tokens, UDIDs, or unredacted diagnostic archives.** Redact sensitive data
        from logs before sharing them.

  - type: input
    id: app-version
    attributes:
      label: VexSign version
      description: Include the release version or commit/build identifier.
      placeholder: e.g. 1.2.3 (build 45)
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS or iPadOS version
      placeholder: e.g. iOS 18.2
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: e.g. iPhone 15 Pro
    validations:
      required: true

  - type: dropdown
    id: signing-method
    attributes:
      label: Signing method
      description: Select the method involved, or Not applicable if this is unrelated to signing.
      options:
        - Paid Developer Certificate
        - Enterprise Certificate
        - Free Apple ID
        - Other signing method
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear steps and include the expected and actual result.
      placeholder: |
        1. Open…
        2. Tap…
        3. Observe…
      render: text
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostic logs
      description: Paste only the relevant logs. Remove personal data and secrets; do not attach .p12 files, provisioning profiles, tokens, UDIDs, or full diagnostic archives.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I removed passwords, private keys, certificates, tokens, UDIDs, and other sensitive information from this report.
          required: true
