name: Feature request
description: Suggest a specific improvement to VexSign.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first and read the
        [Code of Conduct](https://github.com/raynmahbub/VexSign/blob/main/CODE_OF_CONDUCT.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the user need or friction this feature addresses.
      placeholder: I often need to…
      render: text
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like VexSign to do.
      render: text
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches?
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
