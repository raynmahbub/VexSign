# Dependabot keeps every supported dependency graph current without a robot
# committing to main. It opens focused pull requests; path-filtered validators
# check affected components before maintainers review and merge.
#
# The Xcode app's own packages are declared in project.pbxproj, which Dependabot
# cannot read; the three entries under VexSign/Packages/ below cover the local
# Package.swift manifests instead. The pbxproj requirements are audited by
# `make audit-packages` (VexSign/Documentation/Development/MAINTENANCE.md).
#
# Every `directory` below is relative to the repository root and must contain the
# manifest for its ecosystem. Dependabot reports a missing directory as "no
# manifests found" and then opens nothing, so a stale path fails silently: the
# tree was restructured under VexSign/ once already and every entry except
# github-actions stopped matching. `make verify` now asserts these paths exist
# and hold the manifest they claim
# (VexSign/Tools/Validation/repository-validation/test_workflow_policy.py).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: pip
    # requirements.txt is in Configuration/, so point at the directory that
    # actually holds it rather than the service root.
    directory: /VexSign/Services/WebManager/Configuration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-python:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(server)"
      include: scope
    labels: ["dependencies", "server"]

  - package-ecosystem: npm
    directory: /VexSign/Services/Cloud
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloud-npm:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(cloud)"
      include: scope
    labels: ["dependencies", "cloud-signing"]

  - package-ecosystem: swift
    directory: /VexSign/Packages/NativeSigning
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      native-swift:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(native)"
      include: scope
    labels: ["dependencies", "native-signing"]

  - package-ecosystem: swift
    directory: /VexSign/Packages/SideSign
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sidesign-swift:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(sidesign)"
      include: scope
    labels: ["dependencies", "side-sign"]

  - package-ecosystem: swift
    directory: /VexSign/Packages/Vendor/Zsign
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      zsign-swift:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(zsign)"
      include: scope
    labels: ["dependencies", "vendored"]

  - package-ecosystem: docker
    directory: /VexSign/Services/WebManager
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(server)"
      include: scope
    labels: ["dependencies", "server"]

  - package-ecosystem: docker
    directory: /VexSign/Services/Cloud
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(cloud)"
      include: scope
    labels: ["dependencies", "cloud-signing"]
