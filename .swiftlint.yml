# SwiftLint configuration for VexSign.
#
# Linting is a local step: `make lint` reports, `make lint FIX=1` autocorrects.
# CI does not run SwiftLint and never pushes fixes onto your branch -- the
# auto-fix commits it used to make rewrote correct code into broken code and
# restarted the build every time.
#
# Run locally:   make lint            (report, --strict)
#                make lint FIX=1      (auto-correct)

# Only first-party Swift is linted. Submodules ship their own tooling and the
# generated/vendored directories are not ours to fix.
included:
  - VexSign/App
  - VexSign/Features
  - VexSign/Shared
  - VexSign/Storage
  - VexSign/Networking
  - VexSign/System
  - VexSign/DesignSystem
  # Security owns certificate, CMS and archive validation; it was in neither list, so the
  # most security-sensitive app-layer Swift was never read by the linter.
  - VexSign/Security
  - VexSign/Services
  - VexSign/Resources
  - Platform/Extensions/WidgetExtension
  # The companion app targets are first-party and were simply never listed.
  - Platform/TV
  - Platform/Vision
  - Platform/Watch
  - Tests
  - Packages/AltSourceKit/Sources
  - Packages/NimbleKit/Sources
  # The Apple-account, PKCS#12/CMS and provisioning-profile code is the most security-sensitive
  # Swift in the repository, so it is the least optional to lint. It was out of scope entirely.
  - Packages/NativeSigning
  # The embedded-container host overlay is first-party Swift too, and was in neither list: not
  # included, not excluded, so nothing ever looked at it.
  - Services/Integrations

excluded:
  - .build
  - .git
  # Vendored upstream sources (Zsign, IDeviceKitten). These used to be listed as bare `Zsign` /
  # `IDeviceKitten`, which resolve against the repository root and therefore matched nothing — the
  # same silent-rot failure as a stale Dependabot `directory`. The parent directory is excluded
  # rather than the two children so a package vendored later inherits the same decision; this is
  # the path `.swiftformat` already excludes, and `test_style_config.py` pins the agreement.
  - Packages/Vendor
  # Vendored from SideStore/Catalyst under AGPL-3.0 (see its Package.swift header) and only
  # patched by hash-checked overlays, so its style is upstream's to own — same reasoning as the
  # two vendored packages above.
  - Packages/SideSign
  # Guards for scratch and extraction directories that are created during vendoring or IPA
  # inspection rather than checked in, so they legitimately do not exist in a clean checkout.
  - packages
  - Payload
  - deps
  - _upstream_vexsign
  - _VexSign
  - Services/WebManager/API
  - Services/Cloud
  - Tools
  - Tools/Development
  - "**/.build"
  - "**/Package.swift"

# Rules that fight the codebase or SwiftUI idioms.
disabled_rules:
  - todo                                    # TODO/FIXME markers are fine in a VexSign codebase
  - trailing_whitespace                     # .editorconfig sets trim_trailing_whitespace = false; do not create diff noise
  - multiple_closures_with_trailing_closure # Button(action:) { } label: { } is idiomatic SwiftUI
  - nesting                                 # SwiftUI views nest small helper types freely

# Safe, low-noise opt-ins (all auto-correctable or purely advisory).
opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - first_where
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

# ---------------------------------------------------------------------------
# Rule configuration
# ---------------------------------------------------------------------------

line_length:
  warning: 120
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_function_declarations: false

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - n
    - to
    - ok
    - up
    - db
    - io
    - os
    - ui
    - vm
  allowed_symbols: ["_"]
  validates_start_with_lowercase: warning

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 80
  excluded:
    - ID

# SwiftUI screens get long; keep these advisory and generous.
file_length:
  warning: 1000
  error: 2000
  ignore_comment_only_lines: true

type_body_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 80
  error: 200

function_parameter_count:
  warning: 7
  error: 10

cyclomatic_complexity:
  warning: 15
  error: 30
  ignores_case_statements: true

large_tuple:
  warning: 3
  error: 4

empty_count:
  severity: warning

reporter: "xcode"
