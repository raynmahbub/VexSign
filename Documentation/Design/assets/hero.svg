<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">VexSign</title>
  <desc id="desc">VexSign — sign, install, and manage apps on your iPhone, entirely on device.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08070f"/>
      <stop offset="0.55" stop-color="#0d0a1d"/>
      <stop offset="1" stop-color="#171034"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="970" cy="90" r="260" fill="url(#glow)"/>
  <circle cx="1100" cy="360" r="220" fill="url(#glow2)"/>

  <g transform="translate(76 92)">
    <rect width="112" height="112" rx="30" fill="url(#mark)"/>
    <path fill="#120a24" d="M26 32h20l10 34 10-34h20L68 82H50z" opacity="0.92"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="76" y="270" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-3">VexSign</text>
    <text x="80" y="310" fill="#c9c4e4" font-size="23" font-weight="500">Sign, install, and manage apps — entirely on your iPhone.</text>

    <g transform="translate(80 342)">
      <rect width="152" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="20" y="26" fill="#ddd6fe" font-size="14" font-weight="600">iOS 16+</text>
      <circle cx="120" cy="20" r="4" fill="#4ade80"/>
      <text x="132" y="25" fill="#cfc9e8" font-size="13">On device</text>
    </g>
    <g transform="translate(248 342)">
      <rect width="182" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="20" y="26" fill="#ddd6fe" font-size="14" font-weight="600">Open source</text>
      <text x="126" y="26" fill="#9d95bd" font-size="12">GPL-3.0</text>
    </g>
    <g transform="translate(446 342)">
      <rect width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="20" y="26" fill="#ddd6fe" font-size="14" font-weight="600">Built with SwiftUI</text>
    </g>

    <!-- Product object: an abstract, non-literal interface stack. -->
    <g transform="translate(790 58)">
      <rect x="10" y="18" width="326" height="334" rx="48" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.13"/>
      <rect x="26" y="34" width="294" height="302" rx="38" fill="#0c0918" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="118" y="48" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.12"/>

      <rect x="48" y="86" width="250" height="112" rx="26" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="76" cy="114" r="14" fill="#a855f7" fill-opacity="0.85"/>
      <rect x="100" y="105" width="118" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="100" y="123" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="48" y="220" width="118" height="86" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="180" y="220" width="118" height="86" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="82" cy="250" r="16" fill="#22d3ee" fill-opacity="0.75"/>
      <circle cx="214" cy="250" r="16" fill="#f59e0b" fill-opacity="0.75"/>
      <rect x="66" y="278" width="64" height="8" rx="4" fill="#ffffff" fill-opacity="0.32"/>
      <rect x="198" y="278" width="64" height="8" rx="4" fill="#ffffff" fill-opacity="0.32"/>
      <rect x="48" y="326" width="250" height="1" fill="#ffffff" fill-opacity="0.08"/>
    </g>
  </g>
</svg>
